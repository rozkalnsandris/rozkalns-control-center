name: Phase 5 RPi5 observation production D1 apply

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main SHA authorized for D1 apply
        required: true
        type: string
      expected_ci_run:
        description: Exact successful push CI run on approved_sha
        required: true
        type: string
      expected_preflight_run:
        description: Exact successful Phase 5 readonly preflight run on approved_sha
        required: true
        type: string
      expected_deployment:
        description: Exact active Worker deployment observed by the approved preflight
        required: true
        type: string
      expected_version:
        description: Exact active Worker version observed by the approved preflight
        required: true
        type: string
      migrations:
        description: Exact ordered non-empty migration ceiling from the approved preflight
        required: true
        type: string
      database:
        description: Exact production D1 database name
        required: true
        type: string
      authorization:
        description: Exact owner LIVE authorization string binding every input
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase5-rpi5-observation-d1-live
  cancel-in-progress: false

jobs:
  apply:
    name: one-shot exact-ceiling production D1 apply
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-d1-live
    env:
      APPROVED_SHA: ${{ inputs.approved_sha }}
      EXPECTED_CI_RUN: ${{ inputs.expected_ci_run }}
      EXPECTED_PREFLIGHT_RUN: ${{ inputs.expected_preflight_run }}
      EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_MIGRATIONS: ${{ inputs.migrations }}
      EXPECTED_DATABASE: ${{ inputs.database }}
      OWNER_AUTHORIZATION: ${{ inputs.authorization }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify canonical Node version
        run: node scripts/verify-node-version.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Execute one-shot Phase 5 D1 mutation class
        env:
          CLOUDFLARE_WORKERS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_D1_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_TOKEN }}
        run: node scripts/phase5-rpi5-observation-d1-live.mjs
