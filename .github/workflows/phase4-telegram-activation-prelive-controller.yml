name: Phase 4 Telegram activation pre-LIVE controller

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact 40-character main SHA to freeze into the pre-LIVE receipt
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase4-telegram-activation-prelive-controller
  cancel-in-progress: false

jobs:
  prelive:
    name: freeze Telegram activation pre-LIVE evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production-readonly-reconcile
    env:
      CONTROL_REPO: rozkalnsandris/rozkalns-control-center
      CF_ACCOUNT_ID: 70e29dbca0e8363358659102d2b74178
      WORKER_NAME: rozkalns-control
      DISPATCH_QUEUE_NAME: rozkalns-control-notification-dispatch
      EXPECTED_TARGET_KEY: primary
      EXPECTED_RETRY_POLICY_JSON: '{"schemaVersion":1,"maxAttempts":2,"retryDelaysSeconds":[60]}'
      EXPECTED_BATCH_SIZE: '10'
      EXPECTED_BATCH_TIMEOUT_MS: '5000'
      EXPECTED_MAX_RETRIES: '3'
      EXPECTED_RETRY_DELAY: '60'
      EXPECTED_MAX_CONCURRENCY: '1'
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false

      - name: Freeze GET-only activation inventory and bounded future LIVE envelope
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          umask 077

          stop() {
            {
              printf 'PHASE4_TELEGRAM_PRELIVE_CONTROLLER=STOP\n'
              printf 'STOP=%s\n' "$1"
              printf 'D1_NOTIFICATION_MIGRATIONS=NOT_PROVEN_GET_ONLY\n'
              printf 'TELEGRAM_PROVIDER_REQUEST=NO\n'
              printf 'QUEUE_MUTATION=NO\n'
              printf 'REMOTE_D1_MUTATION=NO\n'
              printf 'WORKER_MUTATION=NO\n'
              printf 'CLOUDFLARE_CONFIG_MUTATION=NO\n'
              printf 'SECRET_MUTATION=NO\n'
              printf 'CLOUDFLARE_MUTATION=NO\n'
              printf 'LIVE_AUTHORIZATION=NOT_GRANTED\n'
            } >&2
            exit 1
          }

          sanitize_diag() {
            printf '%s' "$1" | LC_ALL=C tr -cd '[:alnum:] _./:@,+{}\[\]"=-' | cut -c1-320
          }

          for cmd in curl git jq; do
            command -v "$cmd" >/dev/null 2>&1 || stop "MISSING_${cmd^^}"
          done

          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || stop APPROVED_SHA_INVALID
          [[ "${GITHUB_EVENT_NAME:-}" == workflow_dispatch ]] || stop WORKFLOW_EVENT_NOT_DISPATCH
          [[ "${GITHUB_REF_NAME:-}" == main ]] || stop WORKFLOW_REF_NOT_MAIN
          [[ "${GITHUB_SHA:-}" == "$APPROVED_SHA" ]] || stop WORKFLOW_SHA_NOT_APPROVED_SHA
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]] || stop CHECKOUT_SHA_NOT_APPROVED_SHA
          [[ -n "${GITHUB_TOKEN:-}" ]] || stop MISSING_GITHUB_TOKEN
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || stop MISSING_CLOUDFLARE_API_TOKEN

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          gh_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${CONTROL_REPO}${path}" > "$out" || stop GITHUB_GET_FAILED
          }

          cf_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_GET_FAILED
            jq -e '.success == true' "$out" >/dev/null || stop CLOUDFLARE_RESPONSE_INVALID
          }

          printf '%s\n' STAGE=GITHUB_EXACT_MAIN_CI
          gh_get '/branches/main' "$tmp/main-before.json"
          jq -e --arg sha "$APPROVED_SHA" '.commit.sha == $sha' "$tmp/main-before.json" >/dev/null || stop MAIN_SHA_DRIFT

          gh_get "/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${APPROVED_SHA}&per_page=10" "$tmp/ci-runs.json"
          ci_run_id="$(jq -r --arg sha "$APPROVED_SHA" '
            [ .workflow_runs[]? | select(
                .name == "CI" and
                .path == ".github/workflows/ci.yml" and
                .head_branch == "main" and
                .head_sha == $sha and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success"
              ) ] | sort_by(.run_number) | last | .id // empty
          ' "$tmp/ci-runs.json")"
          [[ -n "$ci_run_id" ]] || stop EXACT_MAIN_CI_NOT_SUCCESS

          printf '%s\n' STAGE=PRODUCTION_WORKER_BASELINE
          cf_get "/workers/scripts/${WORKER_NAME}/deployments" "$tmp/deployments.json"
          jq -e '
            (.result.deployments | type == "array") and
            (.result.deployments | length >= 1) and
            (.result.deployments[0].id | type == "string") and
            (.result.deployments[0].versions | type == "array") and
            (.result.deployments[0].versions | length == 1) and
            (.result.deployments[0].versions[0].version_id | type == "string") and
            (.result.deployments[0].versions[0].percentage == 100)
          ' "$tmp/deployments.json" >/dev/null || stop ACTIVE_DEPLOYMENT_NOT_SINGLE_VERSION_100_PERCENT

          baseline_deployment="$(jq -r '.result.deployments[0].id' "$tmp/deployments.json")"
          baseline_version="$(jq -r '.result.deployments[0].versions[0].version_id' "$tmp/deployments.json")"
          printf 'FROZEN_BASELINE_DEPLOYMENT=%s\n' "$(sanitize_diag "$baseline_deployment")"
          printf 'FROZEN_BASELINE_VERSION=%s\n' "$(sanitize_diag "$baseline_version")"
          printf 'FROZEN_BASELINE_TRAFFIC_PERCENT=100\n'

          printf '%s\n' STAGE=WORKER_ACTIVATION_PREREQUISITE_INVENTORY
          cf_get "/workers/scripts/${WORKER_NAME}/versions/${baseline_version}" "$tmp/version.json"
          jq -e --arg version "$baseline_version" '.result.id == $version and (.result.resources.bindings // [] | type == "array")' "$tmp/version.json" >/dev/null || stop VERSION_BINDING_INVENTORY_INVALID

          binding_failures=0
          classify_plain_text() {
            local binding="$1" expected="$2" label="$3"
            local count
            count="$(jq -r --arg name "$binding" '[.result.resources.bindings[]? | select(.name == $name)] | length' "$tmp/version.json")"
            if [[ "$count" == 0 ]]; then
              printf '%s=MISSING\n' "$label"
              binding_failures=$((binding_failures + 1))
            elif [[ "$count" == 1 ]] && jq -e --arg name "$binding" --arg expected "$expected" '[.result.resources.bindings[]? | select(.name == $name)][0] | .type == "plain_text" and .text == $expected' "$tmp/version.json" >/dev/null; then
              printf '%s=PRESENT_EXPECTED\n' "$label"
            else
              printf '%s=INVALID\n' "$label"
              binding_failures=$((binding_failures + 1))
            fi
          }

          classify_plain_text CONTROL_NOTIFICATION_TRANSITIONS_ENABLED true TRANSITION_OPT_IN
          classify_plain_text CONTROL_NOTIFICATION_DISPATCH_ENABLED true DISPATCH_OPT_IN
          classify_plain_text CONTROL_TELEGRAM_TARGET_KEY "$EXPECTED_TARGET_KEY" TELEGRAM_TARGET_KEY
          classify_plain_text CONTROL_NOTIFICATION_CONTROL_ORIGIN https://control.rozkalns.net CONTROL_ORIGIN

          targets_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_TARGET_KEYS")] | length' "$tmp/version.json")"
          if [[ "$targets_count" == 0 ]]; then
            printf 'TARGET_KEYS=MISSING\n'
            binding_failures=$((binding_failures + 1))
          elif [[ "$targets_count" == 1 ]] && jq -e --arg target "$EXPECTED_TARGET_KEY" '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_TARGET_KEYS")][0] | .type == "plain_text" and ((.text | fromjson) == [$target])' "$tmp/version.json" >/dev/null 2>&1; then
            printf 'TARGET_KEYS=PRESENT_EXPECTED\n'
          else
            printf 'TARGET_KEYS=INVALID\n'
            binding_failures=$((binding_failures + 1))
          fi

          retry_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_RETRY_POLICY")] | length' "$tmp/version.json")"
          if [[ "$retry_count" == 0 ]]; then
            printf 'RETRY_POLICY=MISSING\n'
            binding_failures=$((binding_failures + 1))
          elif [[ "$retry_count" == 1 ]] && jq -e --arg expected "$EXPECTED_RETRY_POLICY_JSON" '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_RETRY_POLICY")][0] | .type == "plain_text" and ((.text | fromjson) == ($expected | fromjson))' "$tmp/version.json" >/dev/null 2>&1; then
            printf 'RETRY_POLICY=PRESENT_EXPECTED\n'
          else
            printf 'RETRY_POLICY=INVALID\n'
            binding_failures=$((binding_failures + 1))
          fi

          for secret_name in CONTROL_TELEGRAM_BOT_TOKEN CONTROL_TELEGRAM_CHAT_ID; do
            secret_count="$(jq -r --arg name "$secret_name" '[.result.resources.bindings[]? | select(.name == $name)] | length' "$tmp/version.json")"
            if [[ "$secret_count" == 0 ]]; then
              printf '%s_BINDING=MISSING\n' "$secret_name"
              binding_failures=$((binding_failures + 1))
            elif [[ "$secret_count" == 1 ]] && jq -e --arg name "$secret_name" '[.result.resources.bindings[]? | select(.name == $name)][0] | .type == "secret_text" or .type == "secret_key"' "$tmp/version.json" >/dev/null; then
              printf '%s_BINDING=PRESENT_SECRET\n' "$secret_name"
            else
              printf '%s_BINDING=INVALID\n' "$secret_name"
              binding_failures=$((binding_failures + 1))
            fi
          done

          producer_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "NOTIFICATION_DISPATCH_QUEUE")] | length' "$tmp/version.json")"
          if [[ "$producer_count" == 0 ]]; then
            printf 'DISPATCH_QUEUE_PRODUCER_BINDING=MISSING\n'
            binding_failures=$((binding_failures + 1))
          elif [[ "$producer_count" == 1 ]] && jq -e --arg queue "$DISPATCH_QUEUE_NAME" '[.result.resources.bindings[]? | select(.name == "NOTIFICATION_DISPATCH_QUEUE")][0] | .type == "queue" and ((.queue_name // "") == $queue)' "$tmp/version.json" >/dev/null; then
            printf 'DISPATCH_QUEUE_PRODUCER_BINDING=PRESENT_EXPECTED\n'
          else
            printf 'DISPATCH_QUEUE_PRODUCER_BINDING=INVALID\n'
            binding_failures=$((binding_failures + 1))
          fi
          printf 'NOTIFICATION_ACTIVATION_BINDING_FAILURES=%s\n' "$binding_failures"

          printf '%s\n' STAGE=INDEPENDENT_QUEUE_INVENTORY
          cf_get '/queues?per_page=100&page=1' "$tmp/queues.json"
          jq -e '.result | type == "array"' "$tmp/queues.json" >/dev/null || stop QUEUE_INVENTORY_INVALID
          total_pages="$(jq -r '.result_info.total_pages // 1' "$tmp/queues.json")"
          [[ "$total_pages" == 1 ]] || stop QUEUE_INVENTORY_PAGINATION_AMBIGUOUS

          queue_count="$(jq -r --arg queue "$DISPATCH_QUEUE_NAME" '[.result[]? | select(.queue_name == $queue)] | length' "$tmp/queues.json")"
          [[ "$queue_count" == 0 || "$queue_count" == 1 ]] || stop DISPATCH_QUEUE_AMBIGUOUS

          queue_create_count=0
          queue_pause_count=0
          queue_consumer_count=0
          provider_resume_count=1
          queue_id=NONE
          queue_pause_state=NOT_APPLICABLE
          queue_consumer_state=ABSENT
          backlog_count=NOT_APPLICABLE
          backlog_bytes=NOT_APPLICABLE
          oldest_message_ms=NOT_APPLICABLE

          if [[ "$queue_count" == 0 ]]; then
            printf 'DISPATCH_QUEUE=ABSENT\n'
            queue_create_count=1
            queue_pause_count=1
            queue_consumer_count=1
          else
            queue_id="$(jq -r --arg queue "$DISPATCH_QUEUE_NAME" '[.result[]? | select(.queue_name == $queue)][0].queue_id // empty' "$tmp/queues.json")"
            [[ "$queue_id" =~ ^[A-Za-z0-9_-]{1,128}$ ]] || stop DISPATCH_QUEUE_ID_INVALID
            printf 'DISPATCH_QUEUE=PRESENT\n'
            printf 'DISPATCH_QUEUE_ID=%s\n' "$(sanitize_diag "$queue_id")"

            cf_get "/queues/${queue_id}" "$tmp/queue.json"
            jq -e --arg id "$queue_id" --arg name "$DISPATCH_QUEUE_NAME" '.result.queue_id == $id and .result.queue_name == $name' "$tmp/queue.json" >/dev/null || stop DISPATCH_QUEUE_DETAIL_DRIFT
            queue_pause_raw="$(jq -r 'if (.result.settings | type) == "object" and (.result.settings.delivery_paused | type) == "boolean" then (.result.settings.delivery_paused | tostring) else "unknown" end' "$tmp/queue.json")"
            if [[ "$queue_pause_raw" == true ]]; then
              queue_pause_state=PAUSED
            elif [[ "$queue_pause_raw" == false ]]; then
              queue_pause_state=ACTIVE
              queue_pause_count=1
            else
              stop DISPATCH_QUEUE_PAUSE_STATE_NOT_REPORTED
            fi
            printf 'DISPATCH_QUEUE_DELIVERY=%s\n' "$queue_pause_state"

            producer_total="$(jq -r '.result.producers // [] | length' "$tmp/queue.json")"
            if [[ "$producer_total" == 0 ]]; then
              printf 'DISPATCH_QUEUE_RUNTIME_PRODUCER=ABSENT\n'
            elif [[ "$producer_total" == 1 ]] && jq -e --arg worker "$WORKER_NAME" '.result.producers[0].type == "worker" and .result.producers[0].script == $worker' "$tmp/queue.json" >/dev/null; then
              printf 'DISPATCH_QUEUE_RUNTIME_PRODUCER=PRESENT_EXPECTED\n'
            else
              printf 'DISPATCH_QUEUE_RUNTIME_PRODUCER=DRIFTED\n'
            fi

            cf_get "/queues/${queue_id}/consumers" "$tmp/consumers.json"
            jq -e '.result | type == "array"' "$tmp/consumers.json" >/dev/null || stop DISPATCH_QUEUE_CONSUMERS_INVALID
            consumer_total="$(jq -r '.result | length' "$tmp/consumers.json")"
            if [[ "$consumer_total" == 0 ]]; then
              queue_consumer_state=ABSENT
              queue_consumer_count=1
            elif [[ "$consumer_total" == 1 ]] && jq -e \
              --arg worker "$WORKER_NAME" \
              --arg queue "$DISPATCH_QUEUE_NAME" \
              --argjson batch "$EXPECTED_BATCH_SIZE" \
              --argjson wait "$EXPECTED_BATCH_TIMEOUT_MS" \
              --argjson retries "$EXPECTED_MAX_RETRIES" \
              --argjson delay "$EXPECTED_RETRY_DELAY" \
              --argjson concurrency "$EXPECTED_MAX_CONCURRENCY" '
                .result[0].type == "worker" and
                .result[0].queue_name == $queue and
                ((.result[0].script_name == null) or (.result[0].script_name == $worker)) and
                .result[0].settings.batch_size == $batch and
                .result[0].settings.max_wait_time_ms == $wait and
                .result[0].settings.max_retries == $retries and
                .result[0].settings.retry_delay == $delay and
                .result[0].settings.max_concurrency == $concurrency and
                ((.result[0].dead_letter_queue // "") == "")
              ' "$tmp/consumers.json" >/dev/null; then
              queue_consumer_state=PRESENT_EXPECTED
            else
              queue_consumer_state=DRIFTED
              queue_consumer_count=1
            fi
            printf 'DISPATCH_QUEUE_CONSUMER=%s\n' "$queue_consumer_state"

            cf_get "/queues/${queue_id}/metrics" "$tmp/metrics.json"
            jq -e '
              (.result.backlog_count | type == "number" and . >= 0) and
              (.result.backlog_bytes | type == "number" and . >= 0) and
              (.result.oldest_message_timestamp_ms | type == "number" and . >= 0)
            ' "$tmp/metrics.json" >/dev/null || stop DISPATCH_QUEUE_METRICS_INVALID
            backlog_count="$(jq -r '.result.backlog_count' "$tmp/metrics.json")"
            backlog_bytes="$(jq -r '.result.backlog_bytes' "$tmp/metrics.json")"
            oldest_message_ms="$(jq -r '.result.oldest_message_timestamp_ms' "$tmp/metrics.json")"
            printf 'DISPATCH_QUEUE_BACKLOG_COUNT=%s\n' "$backlog_count"
            printf 'DISPATCH_QUEUE_BACKLOG_BYTES=%s\n' "$backlog_bytes"
            printf 'DISPATCH_QUEUE_OLDEST_MESSAGE_TIMESTAMP_MS=%s\n' "$oldest_message_ms"
            printf 'DISPATCH_QUEUE_METRICS=BEST_EFFORT_POINT_IN_TIME\n'
          fi

          printf '%s\n' STAGE=FINAL_ANTI_DRIFT
          gh_get '/branches/main' "$tmp/main-after.json"
          jq -e --arg sha "$APPROVED_SHA" '.commit.sha == $sha' "$tmp/main-after.json" >/dev/null || stop FINAL_MAIN_SHA_DRIFT
          cf_get "/workers/scripts/${WORKER_NAME}/deployments" "$tmp/deployments-after.json"
          jq -e --arg deployment "$baseline_deployment" --arg version "$baseline_version" '
            .result.deployments[0].id == $deployment and
            (.result.deployments[0].versions | length == 1) and
            .result.deployments[0].versions[0].version_id == $version and
            .result.deployments[0].versions[0].percentage == 100
          ' "$tmp/deployments-after.json" >/dev/null || stop FINAL_PRODUCTION_BASELINE_DRIFT

          printf '%s\n' STAGE=BOUNDED_FUTURE_LIVE_ENVELOPE
          printf 'PHASE4_TELEGRAM_PRELIVE_CONTROLLER=EVIDENCE_FROZEN\n'
          printf 'FROZEN_REPOSITORY=%s\n' "$CONTROL_REPO"
          printf 'FROZEN_APPROVED_SHA=%s\n' "$APPROVED_SHA"
          printf 'FROZEN_TARGET=cloudflare-account:%s/worker:%s\n' "$CF_ACCOUNT_ID" "$WORKER_NAME"
          printf 'EXACT_MAIN_CI_RUN_ID=%s\n' "$ci_run_id"
          printf 'D1_NOTIFICATION_MIGRATIONS=NOT_PROVEN_GET_ONLY\n'
          printf 'D1_MUTATION_MAX=0_UNTIL_SEPARATE_REVIEW\n'
          printf 'QUEUE_CREATE_MUTATION_COUNT=%s\n' "$queue_create_count"
          printf 'QUEUE_PAUSE_MUTATION_COUNT=%s\n' "$queue_pause_count"
          printf 'QUEUE_CONSUMER_MUTATION_COUNT=%s\n' "$queue_consumer_count"
          printf 'QUEUE_PRE_PROVIDER_MUTATION_MAX=3\n'
          printf 'SECRET_BINDING_MUTATION_MAX=2\n'
          printf 'SECRET_BINDING_NAMES=CONTROL_TELEGRAM_BOT_TOKEN,CONTROL_TELEGRAM_CHAT_ID\n'
          printf 'WORKER_ROLLOUT_CONTROLLER=.github/workflows/production-worker-composite-live.yml\n'
          printf 'WORKER_VERSION_UPLOAD_MAX=1\n'
          printf 'WORKER_DEPLOYMENT_WRITE_MAX=2\n'
          printf 'WORKER_CANDIDATE_NORMAL_TRAFFIC_PERCENT=0\n'
          printf 'WORKER_PROMOTION_TRAFFIC_PERCENT=100\n'
          printf 'PROVIDER_DELIVERY_RESUME_MUTATION_COUNT=%s\n' "$provider_resume_count"
          printf 'PROVIDER_API_REQUEST_MAX=0_UNTIL_SEPARATE_AUTHORIZATION\n'
          printf 'EXCLUDED_MUTATIONS=QUEUE_DELETE,QUEUE_PURGE,D1_WRITE_OUTSIDE_REVIEWED_MIGRATIONS,SECRET_EXPORT,PERMISSION_CHANGE,DNS_ACCESS_ROUTE_BINDING_CHANGE,ROLLBACK,CLEANUP,UNLISTED_MUTATION\n'
          printf 'TELEGRAM_PROVIDER_REQUEST=NO\n'
          printf 'QUEUE_MUTATION=NO\n'
          printf 'REMOTE_D1_MUTATION=NO\n'
          printf 'WORKER_MUTATION=NO\n'
          printf 'CLOUDFLARE_CONFIG_MUTATION=NO\n'
          printf 'SECRET_MUTATION=NO\n'
          printf 'CLOUDFLARE_MUTATION=NO\n'
          printf 'LIVE_AUTHORIZATION=NOT_GRANTED\n'
          printf 'NEXT_GATE=D1_MIGRATION_EVIDENCE_AND_SEPARATE_LIVE_SCOPE_REVIEW\n'