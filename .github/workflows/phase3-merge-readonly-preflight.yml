name: Phase 3 Merge read-only D1 preflight

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: phase3-merge-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 278 &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.id == 277435981 &&
        github.event.comment.user.type == 'User' &&
        github.event.comment.body == '/phase3-merge-preflight'
      )
    name: verify Merge D1 read-only baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: production-readonly-reconcile
      deployment: false
    env:
      CONTROL_REPO: rozkalnsandris/rozkalns-control-center
      CF_ACCOUNT_ID: 70e29dbca0e8363358659102d2b74178
      WORKER_NAME: rozkalns-control
      HOSTNAME: control.rozkalns.net
      DB_NAME: rozkalns-control-production
      DB_ID: 8504e986-faf0-450c-bfb5-41b5dbf8be09
      EXPECTED_ACCESS_AUD_SHA256: e6e8acda0850d8c5fa41c5de8b7a0e4dd71e2fcb8f3f9e0654bc05d3499905c9
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_WORKERS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
      CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
      CONTROL_ACCESS_CLIENT_SECRET: ${{ secrets.CONTROL_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Verify Merge D1 schema, Access audience and clean pre-canary state without mutation
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          stop() {
            {
              printf 'MERGE_READONLY_PREFLIGHT=STOP\n'
              printf 'STOP=%s\n' "$1"
              printf 'ACCESS_REQUEST_METHOD=GET\n'
              printf 'ACCESS_MUTATION=NO\n'
              printf 'MERGE_POST_SENT=NO\n'
              printf 'REMOTE_D1_MUTATION=NO\n'
              printf 'WORKER_MUTATION=NO\n'
              printf 'CLOUDFLARE_CONFIG_MUTATION=NO\n'
              printf 'GITHUB_DECISION_MUTATION=NO\n'
              printf 'GITHUB_APP_PERMISSION_MUTATION=NO\n'
            } >&2
            exit 1
          }

          for cmd in curl jq; do
            command -v "$cmd" >/dev/null 2>&1 || stop "MISSING_${cmd^^}"
          done

          [ "${GITHUB_REF_NAME:-}" = "main" ] || stop WORKFLOW_REF_NOT_MAIN
          case "${GITHUB_EVENT_NAME:-}" in
            workflow_dispatch)
              ;;
            issue_comment)
              [ -n "${GITHUB_EVENT_PATH:-}" ] || stop MISSING_GITHUB_EVENT_PATH
              jq -e '
                .action == "created" and
                .issue.number == 278 and
                (.issue | has("pull_request") | not) and
                .comment.user.id == 277435981 and
                .comment.user.type == "User" and
                .comment.body == "/phase3-merge-preflight"
              ' "$GITHUB_EVENT_PATH" >/dev/null || stop OWNER_COMMENT_TRIGGER_INVALID
              ;;
            *) stop WORKFLOW_EVENT_UNSUPPORTED ;;
          esac

          [ -n "${GITHUB_TOKEN:-}" ] || stop MISSING_GITHUB_TOKEN
          [ -n "${CLOUDFLARE_WORKERS_READ_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_WORKERS_READ_TOKEN
          [ -n "${CLOUDFLARE_D1_READ_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_D1_READ_TOKEN
          [ -n "${CONTROL_ACCESS_CLIENT_ID:-}" ] || stop MISSING_CONTROL_ACCESS_CLIENT_ID
          [ -n "${CONTROL_ACCESS_CLIENT_SECRET:-}" ] || stop MISSING_CONTROL_ACCESS_CLIENT_SECRET
          [[ "${EXPECTED_ACCESS_AUD_SHA256:-}" =~ ^[0-9a-f]{64}$ ]] || stop EXPECTED_ACCESS_AUD_SHA256_INVALID

          printf 'WORKERS_READ_SECRET_NAME=CLOUDFLARE_API_TOKEN\n'
          printf 'D1_READ_SECRET_NAME=CLOUDFLARE_D1_READ_TOKEN\n'
          printf 'ACCESS_CREDENTIALS_SOURCE=ENVIRONMENT_SECRET_BINDINGS\n'

          tmp="${RUNNER_TEMP}/phase3-merge-readonly-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$tmp"

          gh_control_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${CONTROL_REPO}${path}" > "$out" || stop GITHUB_CONTROL_GET_FAILED
          }

          cf_workers_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_WORKERS_READ_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_WORKERS_GET_FAILED
            jq -e '.success == true' "$out" >/dev/null || stop CLOUDFLARE_WORKERS_RESPONSE_INVALID
          }

          cf_d1_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_D1_READ_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_D1_GET_FAILED
            jq -e '.success == true' "$out" >/dev/null || stop CLOUDFLARE_D1_RESPONSE_INVALID
          }

          cf_d1_read_query() {
            local sql="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_D1_READ_TOKEN}" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database/${DB_ID}/query" > "$out" || stop CLOUDFLARE_D1_READ_QUERY_FAILED
            jq -e '
              .success == true and
              (.result | type == "array") and
              (.result | length == 1) and
              .result[0].success == true and
              ((.result[0].meta.changed_db // false) == false) and
              (((.result[0].meta.rows_written // 0) | tonumber) == 0) and
              (((.result[0].meta.changes // 0) | tonumber) == 0)
            ' "$out" >/dev/null || stop D1_READ_QUERY_REPORTED_MUTATION_OR_FAILURE
          }

          access_get() {
            local out="$1"
            curl -sS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -o "$out" \
              -w '%{http_code}' \
              -H "CF-Access-Client-Id: ${CONTROL_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CONTROL_ACCESS_CLIENT_SECRET}" \
              -H 'Accept: application/json' \
              "https://${HOSTNAME}/api/github/merge" || stop ACCESS_GET_FAILED
          }

          printf '%s\n' STAGE=GITHUB_EXACT_MAIN_CI
          run_sha="${GITHUB_SHA:-}"
          [[ "$run_sha" =~ ^[0-9a-f]{40}$ ]] || stop WORKFLOW_SHA_INVALID

          gh_control_get '/branches/main' "$tmp/main.json"
          jq -e --arg sha "$run_sha" '.commit.sha == $sha' "$tmp/main.json" >/dev/null || stop MAIN_SHA_DRIFT

          gh_control_get "/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${run_sha}&per_page=10" "$tmp/ci-runs.json"
          ci_run_id="$(
            jq -r --arg sha "$run_sha" '
              [
                .workflow_runs[]?
                | select(
                    .name == "CI" and
                    .path == ".github/workflows/ci.yml" and
                    .head_branch == "main" and
                    .head_sha == $sha and
                    .event == "push" and
                    .status == "completed" and
                    .conclusion == "success"
                  )
              ]
              | sort_by(.run_number)
              | last
              | .id // empty
            ' "$tmp/ci-runs.json"
          )"
          [[ "$ci_run_id" =~ ^[0-9]+$ ]] || stop EXACT_MAIN_CI_NOT_SUCCESS
          gh_control_get "/actions/runs/${ci_run_id}" "$tmp/ci.json"
          jq -e --arg sha "$run_sha" --argjson id "$ci_run_id" '
            .id == $id and
            .name == "CI" and
            .path == ".github/workflows/ci.yml" and
            .head_branch == "main" and
            .head_sha == $sha and
            .event == "push" and
            .status == "completed" and
            .conclusion == "success"
          ' "$tmp/ci.json" >/dev/null || stop EXACT_MAIN_CI_DRIFT
          printf 'SOURCE_SHA=%s\n' "$run_sha"
          printf 'CI_RUN_ID=%s\n' "$ci_run_id"

          printf '%s\n' STAGE=PRODUCTION_WORKER_BASELINE
          cf_workers_get "/workers/scripts/${WORKER_NAME}/deployments" "$tmp/deployments.json"
          jq -e '
            (.result.deployments | type == "array") and
            (.result.deployments | length >= 1) and
            (.result.deployments[0].id | type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")) and
            (.result.deployments[0].versions | type == "array") and
            (.result.deployments[0].versions | length == 1) and
            (.result.deployments[0].versions[0].version_id | type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")) and
            .result.deployments[0].versions[0].percentage == 100
          ' "$tmp/deployments.json" >/dev/null || stop PRODUCTION_WORKER_BASELINE_INVALID
          deployment_id="$(jq -r '.result.deployments[0].id' "$tmp/deployments.json")"
          worker_version="$(jq -r '.result.deployments[0].versions[0].version_id' "$tmp/deployments.json")"
          printf 'DEPLOYMENT_ID=%s\n' "$deployment_id"
          printf 'WORKER_VERSION=%s\n' "$worker_version"
          printf 'TRAFFIC_PERCENT=100\n'

          printf '%s\n' STAGE=PRODUCTION_D1_IDENTITY
          cf_d1_get "/d1/database/${DB_ID}" "$tmp/database.json"
          jq -e --arg id "$DB_ID" --arg name "$DB_NAME" '
            .result.uuid == $id and .result.name == $name
          ' "$tmp/database.json" >/dev/null || stop D1_DATABASE_IDENTITY_MISMATCH
          printf 'D1_DATABASE_ID=%s\n' "$DB_ID"
          printf 'D1_DATABASE_NAME=%s\n' "$DB_NAME"

          printf '%s\n' STAGE=MERGE_DECISIONS_SCHEMA
          cf_d1_read_query 'PRAGMA table_info("merge_decisions")' "$tmp/table-info.json"
          jq -e '
            [
              .result[0].results[]
              | {name, type, notnull, pk}
            ] == [
              {name:"request_id", type:"TEXT", notnull:1, pk:1},
              {name:"fingerprint", type:"TEXT", notnull:1, pk:0},
              {name:"actor_subject", type:"TEXT", notnull:1, pk:0},
              {name:"actor_email", type:"TEXT", notnull:0, pk:0},
              {name:"repository", type:"TEXT", notnull:1, pk:0},
              {name:"project_id", type:"TEXT", notnull:1, pk:0},
              {name:"issue_number", type:"INTEGER", notnull:1, pk:0},
              {name:"pull_number", type:"INTEGER", notnull:1, pk:0},
              {name:"merge_method", type:"TEXT", notnull:1, pk:0},
              {name:"expected_head_sha", type:"TEXT", notnull:1, pk:0},
              {name:"expected_main_sha", type:"TEXT", notnull:1, pk:0},
              {name:"requested_at", type:"TEXT", notnull:1, pk:0},
              {name:"state", type:"TEXT", notnull:1, pk:0},
              {name:"outcome_code", type:"TEXT", notnull:0, pk:0},
              {name:"mutation_attempted", type:"INTEGER", notnull:0, pk:0},
              {name:"observed_head_sha", type:"TEXT", notnull:0, pk:0},
              {name:"observed_main_sha", type:"TEXT", notnull:0, pk:0},
              {name:"observed_at", type:"TEXT", notnull:0, pk:0},
              {name:"merge_sha", type:"TEXT", notnull:0, pk:0},
              {name:"completed_at", type:"TEXT", notnull:0, pk:0}
            ]
          ' "$tmp/table-info.json" >/dev/null || stop MERGE_DECISIONS_SCHEMA_MISMATCH
          printf 'MERGE_DECISIONS_SCHEMA=PASS\n'

          printf '%s\n' STAGE=MERGE_DECISIONS_INDEXES
          cf_d1_read_query 'PRAGMA index_list("merge_decisions")' "$tmp/index-list.json"
          jq -e '
            ([.result[0].results[] | select(.name == "idx_merge_decisions_state_requested_at" and .unique == 0 and .partial == 0)] | length) == 1 and
            ([.result[0].results[] | select(.name == "idx_merge_decisions_repository_pull_requested_at" and .unique == 0 and .partial == 0)] | length) == 1
          ' "$tmp/index-list.json" >/dev/null || stop MERGE_DECISIONS_INDEX_LIST_MISMATCH

          cf_d1_read_query 'PRAGMA index_info("idx_merge_decisions_state_requested_at")' "$tmp/index-state.json"
          jq -e '
            [.result[0].results[] | .name] == ["state", "requested_at"]
          ' "$tmp/index-state.json" >/dev/null || stop MERGE_DECISIONS_STATE_INDEX_MISMATCH

          cf_d1_read_query 'PRAGMA index_info("idx_merge_decisions_repository_pull_requested_at")' "$tmp/index-repository.json"
          jq -e '
            [.result[0].results[] | .name] == ["repository", "pull_number", "requested_at"]
          ' "$tmp/index-repository.json" >/dev/null || stop MERGE_DECISIONS_REPOSITORY_INDEX_MISMATCH
          printf 'MERGE_DECISIONS_INDEXES=PASS\n'

          printf '%s\n' STAGE=MERGE_DECISIONS_PRECANARY_STATE
          cf_d1_read_query 'SELECT COUNT(*) AS row_count FROM merge_decisions' "$tmp/row-count.json"
          jq -e '
            (.result[0].results | length) == 1 and
            (((.result[0].results[0].row_count // -1) | tonumber) == 0)
          ' "$tmp/row-count.json" >/dev/null || stop MERGE_DECISIONS_NOT_EMPTY
          printf 'MERGE_DECISIONS_ROW_COUNT=0\n'

          printf '%s\n' STAGE=MERGE_ACCESS_AUDIENCE_PREFLIGHT
          access_audience_mismatch=NO
          access_audience_fingerprint_unknown=NO
          access_http="$(access_get "$tmp/access.json")"
          case "$access_http" in
            200)
              jq -e '
                type == "object" and
                .status == "AUTHENTICATED" and
                (keys | sort) == ["status"]
              ' "$tmp/access.json" >/dev/null || stop MERGE_ACCESS_AUTH_SUCCESS_BODY_INVALID
              printf 'MERGE_ACCESS_AUTH=PASS\n'
              printf 'MERGE_ACCESS_AUDIENCE_DIAGNOSTIC=NOT_REQUIRED\n'
              ;;
            403)
              jq -e '
                type == "object" and
                .error == "ACCESS_AUTHENTICATION_FAILED" and
                .diagnostic == "ACCESS_JWT_AUDIENCE_INVALID" and
                (.audience | type == "object") and
                .audience.shape == "ARRAY" and
                (.audience.count | type == "number") and
                .audience.count >= 1 and
                .audience.count <= 32 and
                (.audience.sha256 | type == "array") and
                (.audience.sha256 | length >= 1 and length <= 4) and
                all(.audience.sha256[]; type == "string" and test("^[0-9a-f]{64}$"))
              ' "$tmp/access.json" >/dev/null || stop MERGE_ACCESS_AUDIENCE_DIAGNOSTIC_UNEXPECTED
              observed_access_aud_sha256="$(jq -r '.audience.sha256 | join(",")' "$tmp/access.json")"
              printf 'OBSERVED_ACCESS_AUD_SHA256=%s\n' "$observed_access_aud_sha256"
              printf 'EXPECTED_ACCESS_AUD_SHA256=%s\n' "$EXPECTED_ACCESS_AUD_SHA256"
              printf 'MERGE_ACCESS_AUTH=FAIL_AUDIENCE_MISMATCH\n'
              if jq -e --arg expected "$EXPECTED_ACCESS_AUD_SHA256" '
                any(.audience.sha256[]; . == $expected)
              ' "$tmp/access.json" >/dev/null; then
                access_audience_mismatch=YES
                printf 'MERGE_ACCESS_AUDIENCE_DIAGNOSTIC=MATCHED_KNOWN_ACCESS_APPLICATION_FINGERPRINT\n'
              else
                access_audience_fingerprint_unknown=YES
                printf 'MERGE_ACCESS_AUDIENCE_DIAGNOSTIC=UNKNOWN_ACCESS_APPLICATION_FINGERPRINT\n'
              fi
              ;;
            *)
              stop "MERGE_ACCESS_HTTP_UNEXPECTED_${access_http}"
              ;;
          esac

          printf '%s\n' STAGE=FINAL_ANTI_DRIFT
          gh_control_get '/branches/main' "$tmp/main-final.json"
          jq -e --arg sha "$run_sha" '.commit.sha == $sha' "$tmp/main-final.json" >/dev/null || stop MAIN_SHA_FINAL_DRIFT

          cf_workers_get "/workers/scripts/${WORKER_NAME}/deployments" "$tmp/deployments-final.json"
          jq -e --arg deployment "$deployment_id" --arg version "$worker_version" '
            (.result.deployments | type == "array") and
            (.result.deployments | length >= 1) and
            .result.deployments[0].id == $deployment and
            (.result.deployments[0].versions | type == "array") and
            (.result.deployments[0].versions | length == 1) and
            .result.deployments[0].versions[0].version_id == $version and
            .result.deployments[0].versions[0].percentage == 100
          ' "$tmp/deployments-final.json" >/dev/null || stop PRODUCTION_WORKER_FINAL_DRIFT

          if [ "$access_audience_fingerprint_unknown" = YES ]; then
            stop MERGE_ACCESS_AUDIENCE_FINGERPRINT_UNKNOWN
          fi
          if [ "$access_audience_mismatch" = YES ]; then
            stop MERGE_ACCESS_AUDIENCE_CONFIG_MISMATCH
          fi

          printf 'MERGE_READONLY_PREFLIGHT=PASS\n'
          printf 'SOURCE_SHA=%s\n' "$run_sha"
          printf 'CI_RUN_ID=%s\n' "$ci_run_id"
          printf 'DEPLOYMENT_ID=%s\n' "$deployment_id"
          printf 'WORKER_VERSION=%s\n' "$worker_version"
          printf 'TRAFFIC_PERCENT=100\n'
          printf 'D1_DATABASE_ID=%s\n' "$DB_ID"
          printf 'D1_DATABASE_NAME=%s\n' "$DB_NAME"
          printf 'MERGE_DECISIONS_SCHEMA=PASS\n'
          printf 'MERGE_DECISIONS_INDEXES=PASS\n'
          printf 'MERGE_DECISIONS_ROW_COUNT=0\n'
          printf 'ACCESS_REQUEST_METHOD=GET\n'
          printf 'ACCESS_MUTATION=NO\n'
          printf 'MERGE_POST_SENT=NO\n'
          printf 'REMOTE_D1_MUTATION=NO\n'
          printf 'WORKER_MUTATION=NO\n'
          printf 'CLOUDFLARE_CONFIG_MUTATION=NO\n'
          printf 'GITHUB_DECISION_MUTATION=NO\n'
          printf 'GITHUB_APP_PERMISSION_MUTATION=NO\n'