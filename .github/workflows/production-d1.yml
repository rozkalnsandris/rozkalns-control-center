name: Retired Production D1 Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: retired one-shot production D1 canary
    # This completed one-shot has no workflow_call trigger, so it remains inert.
    if: ${{ github.event_name == 'workflow_call' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Retired
        run: |
          echo 'The #74 first-production-D1 canary is completed and cannot be replayed. Future privileged operations must use the reviewed Control authorization contract.'
