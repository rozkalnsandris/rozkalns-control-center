name: Phase 5 RPi5 observation GET/SELECT-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase5-rpi5-observation-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: classify dormant RPi5 observation production baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production-readonly-reconcile
    env:
      CONTROL_REPO: rozkalnsandris/rozkalns-control-center
      CF_ACCOUNT_ID: 70e29dbca0e8363358659102d2b74178
      WORKER_NAME: rozkalns-control
      DB_NAME: rozkalns-control-production
      DB_ID: 8504e986-faf0-450c-bfb5-41b5dbf8be09
      DB_JURISDICTION: eu
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_WORKERS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}

    steps:
      - name: Prove exact-main dormant baseline without production mutation
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          stop() {
            {
              printf 'PHASE5_RPI5_OBSERVATION_PREFLIGHT=STOP\n'
              printf 'STOP=%s\n' "$1"
              printf 'RPI5_REQUEST=NO\n'
              printf 'QUEUE_MUTATION=NO\n'
              printf 'REMOTE_D1_MUTATION=NO\n'
              printf 'WORKER_MUTATION=NO\n'
              printf 'CLOUDFLARE_CONFIG_MUTATION=NO\n'
              printf 'SECRET_MUTATION=NO\n'
              printf 'CLOUDFLARE_MUTATION=NO\n'
              printf 'LIVE_AUTHORIZATION=NOT_GRANTED\n'
            } >&2
            exit 1
          }

          sanitize_diag() {
            printf '%s' "$1" | LC_ALL=C tr -cd '[:alnum:] _./:@,+{}\[\]"-' | cut -c1-320
          }

          for cmd in curl jq; do
            command -v "$cmd" >/dev/null 2>&1 || stop "MISSING_${cmd^^}"
          done

          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || stop WORKFLOW_EVENT_NOT_DISPATCH
          [ "${GITHUB_REF_NAME:-}" = "main" ] || stop WORKFLOW_REF_NOT_MAIN
          [ -n "${GITHUB_TOKEN:-}" ] || stop MISSING_GITHUB_TOKEN
          [ -n "${CLOUDFLARE_WORKERS_READ_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_WORKERS_READ_TOKEN
          [ -n "${CLOUDFLARE_D1_READ_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_D1_READ_TOKEN

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          gh_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${CONTROL_REPO}${path}" > "$out" || stop GITHUB_GET_FAILED
          }

          cf_workers_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_WORKERS_READ_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_WORKERS_GET_FAILED
            jq -e '.success == true' "$out" >/dev/null || stop CLOUDFLARE_WORKERS_RESPONSE_INVALID
          }

          cf_d1_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_D1_READ_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_D1_GET_FAILED
            jq -e '.success == true' "$out" >/dev/null || stop CLOUDFLARE_D1_RESPONSE_INVALID
          }

          cf_d1_select() {
            local sql="$1" out="$2"
            [[ "$sql" == SELECT\ * ]] || stop D1_QUERY_NOT_SELECT
            [[ "$sql" != *';'* ]] || stop D1_QUERY_MULTISTATEMENT_FORBIDDEN
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_D1_READ_TOKEN}" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database/${DB_ID}/query" > "$out" || stop CLOUDFLARE_D1_SELECT_FAILED
            jq -e '
              .success == true and
              (.result | type == "array") and
              (.result | length == 1) and
              .result[0].success == true and
              (.result[0].results | type == "array") and
              ((.result[0].meta.changed_db // false) == false) and
              (((.result[0].meta.rows_written // 0) | tonumber) == 0) and
              (((.result[0].meta.changes // 0) | tonumber) == 0)
            ' "$out" >/dev/null || stop D1_SELECT_REPORTED_MUTATION_OR_FAILURE
          }

          printf '%s\n' STAGE=GITHUB_EXACT_MAIN_CI
          run_sha="${GITHUB_SHA:-}"
          [[ "$run_sha" =~ ^[0-9a-f]{40}$ ]] || stop WORKFLOW_SHA_INVALID
          gh_get '/branches/main' "$tmp/main-before.json"
          jq -e --arg sha "$run_sha" '.commit.sha == $sha' "$tmp/main-before.json" >/dev/null || stop MAIN_SHA_DRIFT

          gh_get "/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${run_sha}&per_page=10" "$tmp/ci-runs.json"
          ci_run_id="$(
            jq -r --arg sha "$run_sha" '
              [.workflow_runs[]? | select(
                .name == "CI" and
                .path == ".github/workflows/ci.yml" and
                .head_branch == "main" and
                .head_sha == $sha and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success"
              )] | sort_by(.run_number) | last | .id // empty
            ' "$tmp/ci-runs.json"
          )"
          [[ "$ci_run_id" =~ ^[0-9]+$ ]] || stop EXACT_MAIN_CI_NOT_SUCCESS
          gh_get "/actions/runs/${ci_run_id}" "$tmp/ci.json"
          jq -e --arg sha "$run_sha" --argjson id "$ci_run_id" '
            .id == $id and .name == "CI" and .path == ".github/workflows/ci.yml" and
            .head_branch == "main" and .head_sha == $sha and .event == "push" and
            .status == "completed" and .conclusion == "success"
          ' "$tmp/ci.json" >/dev/null || stop EXACT_MAIN_CI_DRIFT
          printf 'SOURCE_SHA=%s\n' "$run_sha"
          printf 'CI_RUN_ID=%s\n' "$ci_run_id"

          printf '%s\n' STAGE=PRODUCTION_WORKER_BASELINE
          cf_workers_get "/workers/scripts/${WORKER_NAME}/deployments" "$tmp/deployments.json"
          jq -e '
            (.result.deployments | type == "array") and
            (.result.deployments | length >= 1) and
            (.result.deployments[0].id | type == "string") and
            (.result.deployments[0].versions | type == "array") and
            (.result.deployments[0].versions | length == 1) and
            (.result.deployments[0].versions[0].version_id | type == "string") and
            .result.deployments[0].versions[0].percentage == 100
          ' "$tmp/deployments.json" >/dev/null || stop ACTIVE_DEPLOYMENT_NOT_SINGLE_VERSION_100_PERCENT
          current_deployment="$(jq -r '.result.deployments[0].id' "$tmp/deployments.json")"
          current_version="$(jq -r '.result.deployments[0].versions[0].version_id' "$tmp/deployments.json")"
          printf 'CURRENT_DEPLOYMENT=%s\n' "$(sanitize_diag "$current_deployment")"
          printf 'CURRENT_VERSION=%s\n' "$(sanitize_diag "$current_version")"
          printf 'ACTIVE_TRAFFIC_PERCENT=100\n'

          cf_workers_get "/workers/scripts/${WORKER_NAME}/versions/${current_version}" "$tmp/version.json"
          jq -e --arg version "$current_version" '.result.id == $version and (.result.resources.bindings // [] | type == "array")' "$tmp/version.json" >/dev/null || stop VERSION_BINDING_INVENTORY_INVALID

          db_binding_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_DB")] | length' "$tmp/version.json")"
          [ "$db_binding_count" = "1" ] || stop CONTROL_DB_BINDING_MISSING_OR_DUPLICATE
          jq -e --arg db "$DB_ID" '
            [.result.resources.bindings[]? | select(.name == "CONTROL_DB")][0]
            | .type == "d1" and ((.database_id // .id // "") == $db)
          ' "$tmp/version.json" >/dev/null || stop CONTROL_DB_BINDING_INVALID
          printf 'CONTROL_DB_BINDING=VALID\n'

          ingest_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_RPI5_OBSERVATION_INGEST_ENABLED")] | length' "$tmp/version.json")"
          if [ "$ingest_count" = "0" ]; then
            ingest_status=ABSENT_DORMANT
          elif [ "$ingest_count" = "1" ] && jq -e '[.result.resources.bindings[]? | select(.name == "CONTROL_RPI5_OBSERVATION_INGEST_ENABLED")][0] | .type == "plain_text" and .text == "false"' "$tmp/version.json" >/dev/null; then
            ingest_status=EXPLICIT_FALSE_DORMANT
          elif [ "$ingest_count" = "1" ] && jq -e '[.result.resources.bindings[]? | select(.name == "CONTROL_RPI5_OBSERVATION_INGEST_ENABLED")][0] | .type == "plain_text" and .text == "true"' "$tmp/version.json" >/dev/null; then
            stop INGEST_ALREADY_ACTIVE
          else
            stop INGEST_OPT_IN_INVALID
          fi
          printf 'INGEST_OPT_IN=%s\n' "$ingest_status"

          key_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_RPI5_OBSERVATION_VERIFICATION_KEYS")] | length' "$tmp/version.json")"
          if [ "$key_count" = "0" ]; then
            key_status=ABSENT
          elif [ "$key_count" = "1" ] && jq -e '[.result.resources.bindings[]? | select(.name == "CONTROL_RPI5_OBSERVATION_VERIFICATION_KEYS")][0] | (.type == "secret_text" or .type == "secret_key")' "$tmp/version.json" >/dev/null; then
            key_status=PRESENT_PROTECTED
          else
            stop VERIFICATION_KEY_BINDING_INVALID_OR_EXPOSED
          fi
          printf 'VERIFICATION_KEY_BINDING=%s\n' "$key_status"

          printf '%s\n' STAGE=D1_PHASE5_BASELINE
          cf_d1_get "/d1/database/${DB_ID}" "$tmp/db.json"
          jq -e --arg id "$DB_ID" --arg name "$DB_NAME" --arg jurisdiction "$DB_JURISDICTION" '
            .result.uuid == $id and .result.name == $name and .result.jurisdiction == $jurisdiction
          ' "$tmp/db.json" >/dev/null || stop D1_RESOURCE_IDENTITY_INVALID
          printf 'D1_RESOURCE_IDENTITY=VALID\n'

          predecessor_migration_sql="SELECT id, name FROM d1_migrations WHERE name = '0010_webhook_observability_hot_index.sql' ORDER BY id"
          cf_d1_select "$predecessor_migration_sql" "$tmp/predecessor-migration.json"
          predecessor_migration_rows="$(jq -r '.result[0].results | length' "$tmp/predecessor-migration.json")"
          if [ "$predecessor_migration_rows" = "0" ]; then
            predecessor_migration_status=ABSENT
          elif [ "$predecessor_migration_rows" = "1" ] && jq -e '
            .result[0].results[0].name == "0010_webhook_observability_hot_index.sql" and
            (.result[0].results[0].id | type == "number" and floor == .)
          ' "$tmp/predecessor-migration.json" >/dev/null; then
            predecessor_migration_status=PRESENT
          else
            stop D1_0010_MIGRATION_HISTORY_INVALID
          fi
          printf 'D1_0010_MIGRATION=%s\n' "$predecessor_migration_status"

          predecessor_index_sql="SELECT type, name, tbl_name, sql FROM sqlite_schema WHERE name = 'idx_webhook_deliveries_active_updated_delivery'"
          cf_d1_select "$predecessor_index_sql" "$tmp/predecessor-index.json"
          if [ "$predecessor_migration_status" = "ABSENT" ]; then
            jq -e '.result[0].results | length == 0' "$tmp/predecessor-index.json" >/dev/null || stop D1_0010_INDEX_PRESENT_WITHOUT_MIGRATION
            predecessor_index_status=ABSENT_CONSISTENT
          else
            jq -e '
              (.result[0].results | length == 1) and
              .result[0].results[0].type == "index" and
              .result[0].results[0].name == "idx_webhook_deliveries_active_updated_delivery" and
              .result[0].results[0].tbl_name == "webhook_deliveries" and
              (.result[0].results[0].sql | type == "string") and
              ((.result[0].results[0].sql | ascii_downcase | gsub("[[:space:]]+"; " ")) ==
                "create index idx_webhook_deliveries_active_updated_delivery on webhook_deliveries (updated_at, delivery_id) where state <> 'succeeded'")
            ' "$tmp/predecessor-index.json" >/dev/null || stop D1_0010_INDEX_INVALID
            predecessor_index_status=PRESENT_VALID
          fi
          printf 'D1_0010_INDEX=%s\n' "$predecessor_index_status"

          migration_sql="SELECT id, name FROM d1_migrations WHERE name IN ('0011_rpi5_observation_replay_claims.sql','0012_rpi5_production_visibility_projection.sql','0013_rpi5_observation_atomic_acceptance.sql') ORDER BY id"
          cf_d1_select "$migration_sql" "$tmp/migrations.json"
          migration_names="$(jq -c '[.result[0].results[]?.name]' "$tmp/migrations.json")"
          if [ "$migration_names" = '[]' ]; then
            migration_status=ABSENT
          elif [ "$migration_names" = '["0011_rpi5_observation_replay_claims.sql","0012_rpi5_production_visibility_projection.sql","0013_rpi5_observation_atomic_acceptance.sql"]' ]; then
            migration_status=PRESENT
          else
            stop D1_PHASE5_MIGRATION_HISTORY_PARTIAL_OR_INVALID
          fi
          printf 'D1_PHASE5_MIGRATIONS=%s\n' "$migration_status"

          schema_sql="SELECT type, name, tbl_name FROM sqlite_schema WHERE name IN ('rpi5_observation_replay_claims','rpi5_production_visibility') ORDER BY name"
          cf_d1_select "$schema_sql" "$tmp/schema.json"
          if [ "$migration_status" = "ABSENT" ]; then
            jq -e '.result[0].results | length == 0' "$tmp/schema.json" >/dev/null || stop D1_PHASE5_SCHEMA_PRESENT_WITHOUT_MIGRATIONS
            schema_status=ABSENT_CONSISTENT
          else
            jq -e '
              [.result[0].results[]? | {type,name,tbl_name}] == [
                {type:"table",name:"rpi5_observation_replay_claims",tbl_name:"rpi5_observation_replay_claims"},
                {type:"table",name:"rpi5_production_visibility",tbl_name:"rpi5_production_visibility"}
              ]
            ' "$tmp/schema.json" >/dev/null || stop D1_PHASE5_SCHEMA_INVALID
            replay_probe="SELECT replay_key, replay_expires_at, claim_token FROM rpi5_observation_replay_claims LIMIT 0"
            projection_probe="SELECT project_id, repository, observed_at_ms, stored_at_ms FROM rpi5_production_visibility LIMIT 0"
            cf_d1_select "$replay_probe" "$tmp/replay-probe.json"
            cf_d1_select "$projection_probe" "$tmp/projection-probe.json"
            schema_status=PRESENT_VALID
          fi
          printf 'D1_PHASE5_SCHEMA=%s\n' "$schema_status"

          gh_get '/branches/main' "$tmp/main-after.json"
          jq -e --arg sha "$run_sha" '.commit.sha == $sha' "$tmp/main-after.json" >/dev/null || stop MAIN_SHA_DRIFT_AFTER_EVIDENCE

          printf 'PHASE5_RPI5_OBSERVATION_PREFLIGHT=PASS\n'
          printf 'BASELINE=SAFE_FOR_SEPARATELY_AUTHORIZED_ACTIVATION_PLANNING\n'
          printf 'RPI5_REQUEST=NO\n'
          printf 'QUEUE_MUTATION=NO\n'
          printf 'REMOTE_D1_MUTATION=NO\n'
          printf 'WORKER_MUTATION=NO\n'
          printf 'CLOUDFLARE_CONFIG_MUTATION=NO\n'
          printf 'SECRET_MUTATION=NO\n'
          printf 'CLOUDFLARE_MUTATION=NO\n'
          printf 'LIVE_AUTHORIZATION=NOT_GRANTED\n'