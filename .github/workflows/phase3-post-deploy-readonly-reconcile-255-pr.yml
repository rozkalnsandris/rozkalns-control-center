name: Phase 3 post-deploy read-only reconcile 255 PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    name: reconcile production read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CONTROL_REPO: rozkalnsandris/rozkalns-control-center
      EXPECTED_SOURCE_SHA: bdbe6f235fb3fc6171901de4794b690d7d9f8edd
      EXPECTED_CI_RUN_ID: "32175863540"
      CF_ACCOUNT_ID: 70e29dbca0e8363358659102d2b74178
      WORKER_NAME: rozkalns-control
      EXPECTED_PRE_VERSION: 744b3cb5-7c08-4aae-a217-a9fec81f27b2
      EXPECTED_PRE_DEPLOYMENT: 4a1582f5-5f18-423d-b610-ac51c13c5f5a
      EXPECTED_NEW_VERSION: 5577c64b-81a6-4fc6-910d-7770a1f2315f
      HOSTNAME: control.rozkalns.net
      EXPECTED_DOMAIN_ID: ac685929d45e825df5b5f6b803a9814b6dbf5d9d
      DB_ID: 8504e986-faf0-450c-bfb5-41b5dbf8be09
      TARGET_REPO: rozkalnsandris/ops-workflows
      TARGET_ISSUE: "4"
      TARGET_PULL: "3"
      TARGET_HEAD_SHA: d4c5b27e2b32d89447fe3ea1acdde9d2d2a7672e
      TARGET_MAIN_SHA: e2fa7ecb1b1cdfab0711d8e3e147b5ae03a9a3f2
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
      CONTROL_ACCESS_CLIENT_SECRET: ${{ secrets.CONTROL_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Reconcile already-deployed production state
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          stop(){ printf 'PHASE254_GITHUB_RECONCILIATION=STOP\nSTOP=%s\nCLOUDFLARE_MUTATION=NO\nDEPLOY_RETRY=FORBIDDEN\nAUTHORIZATION_CONSUMED=YES\n' "$1"; exit 1; }
          [ -n "${GITHUB_TOKEN:-}" ] || stop MISSING_GITHUB_TOKEN
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_API_TOKEN
          [ -n "${CONTROL_ACCESS_CLIENT_ID:-}" ] || stop MISSING_CONTROL_ACCESS_CLIENT_ID
          [ -n "${CONTROL_ACCESS_CLIENT_SECRET:-}" ] || stop MISSING_CONTROL_ACCESS_CLIENT_SECRET
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT

          gh_get(){ curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${CONTROL_REPO}$1" > "$2" || stop GITHUB_GET_FAILED; }
          cf_get(){ curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}$1" > "$2" || stop CLOUDFLARE_GET_FAILED; jq -e '.success == true' "$2" >/dev/null || stop CLOUDFLARE_RESPONSE_INVALID; }
          access_get(){ local status; status="$(curl -sS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 -H "CF-Access-Client-Id: ${CONTROL_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CONTROL_ACCESS_CLIENT_SECRET}" -H 'Accept: application/json' -o "$2" -w '%{http_code}' "https://${HOSTNAME}$1")" || stop ACCESS_GET_FAILED; [ "$status" = 200 ] || stop "ACCESS_HTTP_${status}"; jq -e 'type == "object"' "$2" >/dev/null || stop ACCESS_RESPONSE_NOT_JSON_OBJECT; printf '%s' "$status"; }

          echo STAGE=GITHUB_SOURCE_CI_RECHECK
          gh_get '/branches/main' "$tmp/main.json"
          jq -e --arg sha "$EXPECTED_SOURCE_SHA" '.commit.sha == $sha' "$tmp/main.json" >/dev/null || stop MAIN_SHA_DRIFT
          gh_get "/actions/runs/${EXPECTED_CI_RUN_ID}" "$tmp/ci.json"
          jq -e --arg sha "$EXPECTED_SOURCE_SHA" --argjson id "$EXPECTED_CI_RUN_ID" '.id==$id and .name=="CI" and .head_branch=="main" and .head_sha==$sha and .event=="push" and .status=="completed" and .conclusion=="success"' "$tmp/ci.json" >/dev/null || stop EXACT_MAIN_CI_DRIFT

          echo STAGE=CLOUDFLARE_ACTIVE_DEPLOYMENT
          cf_get "/workers/scripts/${WORKER_NAME}/deployments" "$tmp/deployments.json"
          dep="$(jq -r '.result.deployments[0].id // empty' "$tmp/deployments.json")"
          ver="$(jq -r '.result.deployments[0].versions[0].version_id // empty' "$tmp/deployments.json")"
          pct="$(jq -r '.result.deployments[0].versions[0].percentage // empty' "$tmp/deployments.json")"
          [ -n "$dep" ] || stop POST_DEPLOYMENT_ID_MISSING
          [ "$dep" != "$EXPECTED_PRE_DEPLOYMENT" ] || stop ACTIVE_DEPLOYMENT_STILL_PRE_DEPLOYMENT
          [ "$ver" = "$EXPECTED_NEW_VERSION" ] || stop ACTIVE_VERSION_NOT_WRANGLER_OBSERVED_VERSION
          [ "$ver" != "$EXPECTED_PRE_VERSION" ] || stop ACTIVE_VERSION_STILL_PRE_VERSION
          [ "$pct" = 100 ] || stop ACTIVE_TRAFFIC_NOT_100_PERCENT
          jq -e '(.result.deployments|type=="array") and (.result.deployments|length>=1) and (.result.deployments[0].versions|type=="array") and (.result.deployments[0].versions|length==1) and .result.deployments[0].versions[0].percentage==100' "$tmp/deployments.json" >/dev/null || stop ACTIVE_DEPLOYMENT_NOT_SINGLE_VERSION_100_PERCENT

          echo STAGE=CLOUDFLARE_VERSION_BINDINGS_DOMAIN
          cf_get "/workers/scripts/${WORKER_NAME}/versions/${ver}" "$tmp/version.json"
          jq -e --arg ver "$ver" --arg db "$DB_ID" '.result.id==$ver and ((.result.resources.bindings//[]) as $b | ($b|type=="array") and any($b[];.name=="GITHUB_APP_PRIVATE_KEY_PEM" and (.type=="secret_text" or .type=="secret_key")) and any($b[];.name=="GITHUB_WEBHOOK_SECRET" and (.type=="secret_text" or .type=="secret_key")) and any($b[];.name=="CONTROL_DB" and .type=="d1" and ((.database_id//.id//"")==$db)) and any($b[];.name=="CONTROL_LIVE_READ_ENABLED" and .type=="plain_text" and .text=="true") and any($b[];.name=="CONTROL_WEBHOOK_RUNTIME_ENABLED" and .type=="plain_text" and .text=="true"))' "$tmp/version.json" >/dev/null || stop POST_VERSION_BINDING_IDENTITY_DRIFT
          cf_get "/workers/scripts/${WORKER_NAME}/subdomain" "$tmp/subdomain.json"
          jq -e '.result.enabled==false and .result.previews_enabled==false' "$tmp/subdomain.json" >/dev/null || stop POST_SUBDOMAIN_OR_PREVIEW_ENABLED
          cf_get "/workers/domains?service=${WORKER_NAME}&hostname=${HOSTNAME}" "$tmp/domains.json"
          jq -e --arg id "$EXPECTED_DOMAIN_ID" --arg host "$HOSTNAME" --arg service "$WORKER_NAME" '(.result|type=="array") and (.result|length==1) and .result[0].id==$id and .result[0].hostname==$host and .result[0].service==$service' "$tmp/domains.json" >/dev/null || stop POST_CUSTOM_DOMAIN_IDENTITY_DRIFT

          echo STAGE=ACCESS_GET_ONLY_RUNTIME
          health="$(access_get '/api/health' "$tmp/health.json")"; jq -e --arg service "$WORKER_NAME" '.status=="ok" and .service==$service' "$tmp/health.json" >/dev/null || stop POST_HEALTH_INVALID
          dashboard="$(access_get '/api/github/dashboard' "$tmp/dashboard.json")"
          preflight="$(access_get "/api/github/needs-changes/preflight?repository=rozkalnsandris%2Fops-workflows&issue=${TARGET_ISSUE}&pull=${TARGET_PULL}" "$tmp/preflight.json")"
          jq -e --arg repo "$TARGET_REPO" --argjson issue "$TARGET_ISSUE" --argjson pull "$TARGET_PULL" --arg head "$TARGET_HEAD_SHA" --arg main "$TARGET_MAIN_SHA" '.kind=="PROJECTED" and .repository==$repo and .issueNumber==$issue and .pullNumber==$pull and .policy.coverage=="COMPLETE" and (.policy.blockedReasons|type=="array" and length==0) and (.policy.sources|type=="array") and (.policy.sources|index("GITHUB_ACTIVE_RULES")!=null) and (.policy.sources|index("GITHUB_CLASSIC_BRANCH_PROTECTION")!=null) and .decision.currentHeadSha==$head and .decision.mainSha==$main' "$tmp/preflight.json" >/dev/null || stop POST_PREFLIGHT_POLICY_NOT_COMPLETE_PROJECTED

          printf 'PHASE254_GITHUB_RECONCILIATION=PASS\nSOURCE_SHA=%s\nCI_RUN_ID=%s\nNEW_VERSION=%s\nNEW_DEPLOYMENT=%s\nACTIVE_TRAFFIC_PERCENT=%s\nHEALTH_HTTP=%s\nDASHBOARD_HTTP=%s\nPREFLIGHT_HTTP=%s\nPREFLIGHT_KIND=PROJECTED\nPREFLIGHT_POLICY_COVERAGE=COMPLETE\nPREFLIGHT_HEAD_SHA=%s\nPREFLIGHT_MAIN_SHA=%s\nNEEDS_CHANGES_POST=NOT_CALLED\nCLOUDFLARE_MUTATION=NO\nDEPLOY_RETRY=FORBIDDEN\nAUTHORIZATION_CONSUMED=YES\n' "$EXPECTED_SOURCE_SHA" "$EXPECTED_CI_RUN_ID" "$ver" "$dep" "$pct" "$health" "$dashboard" "$preflight" "$TARGET_HEAD_SHA" "$TARGET_MAIN_SHA"
