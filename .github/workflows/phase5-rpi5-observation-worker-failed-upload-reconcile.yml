name: Phase 5 RPi5 observation Worker failed-upload GET-only reconcile

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main SHA containing the reconciliation source
        required: true
        type: string
      expected_ci_run:
        description: Exact successful push CI run on approved_sha
        required: true
        type: string
      failed_activation_run:
        description: Exact failed Phase 5 Worker activation run to reconcile
        required: true
        type: string
      failed_source_sha:
        description: Exact source SHA executed by the failed activation run
        required: true
        type: string
      expected_deployment:
        description: Exact pre-attempt active Worker deployment
        required: true
        type: string
      expected_version:
        description: Exact pre-attempt active Worker version
        required: true
        type: string
      expected_non_target_bindings_sha256:
        description: Reviewed SHA-256 of the non-ingest Worker binding inventory
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase5-rpi5-observation-worker-failed-upload-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile failed Worker upload without mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production-readonly-reconcile
    env:
      APPROVED_SHA: ${{ inputs.approved_sha }}
      EXPECTED_CI_RUN: ${{ inputs.expected_ci_run }}
      FAILED_ACTIVATION_RUN: ${{ inputs.failed_activation_run }}
      FAILED_SOURCE_SHA: ${{ inputs.failed_source_sha }}
      EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_NON_TARGET_BINDINGS_SHA256: ${{ inputs.expected_non_target_bindings_sha256 }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact reconciliation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Verify canonical Node version
        run: node scripts/verify-node-version.mjs

      - name: Reconcile failed upload using GET-only evidence
        env:
          CLOUDFLARE_WORKERS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/phase5-rpi5-observation-worker-failed-upload-reconcile.mjs
