name: Bootstrap dependency lock

on:
  push:
    branches: [bootstrap/phase-0-runtime-ci]

permissions:
  contents: write

jobs:
  lock:
    if: github.repository == 'rozkalnsandris/rozkalns-control-center'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bootstrap/phase-0-runtime-ci

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Generate lockfile without dependency lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile to bootstrap branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "build: lock Phase 0 dependencies"
          git push origin HEAD:bootstrap/phase-0-runtime-ci
