name: Worker deploy secret recovery one-shot

on:
  workflow_dispatch:
    inputs:
      owner_authorization:
        description: Exact owner authorization bound to source SHA and one environment-secret update
        required: true
        type: string
      encrypted_value:
        description: GitHub environment-public-key encrypted secret value
        required: true
        type: string
      key_id:
        description: GitHub environment public key id used for encryption
        required: true
        type: string

permissions:
  contents: read

env:
  RECOVERY_CONTRACT: .github/worker-deploy-secret-recovery.json
  CONTROL_REPO: rozkalnsandris/rozkalns-control-center
  TARGET_ENVIRONMENT: production-worker-deploy
  TARGET_SECRET: CONTROL_ACCESS_CLIENT_SECRET

jobs:
  update-secret:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment:
      name: production-secret-admin
      deployment: false
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate contract, authorization, target and key before mutation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECRET_ADMIN_TOKEN: ${{ secrets.CONTROL_SECRET_ADMIN_TOKEN }}
          OWNER_AUTHORIZATION: ${{ inputs.owner_authorization }}
          ENCRYPTED_VALUE: ${{ inputs.encrypted_value }}
          KEY_ID: ${{ inputs.key_id }}
        run: |
          set -euo pipefail
          umask 077

          stop_pre() {
            {
              printf 'WORKER_DEPLOY_SECRET_RECOVERY=STOP\n'
              printf 'STOP=%s\n' "$1"
              printf 'AUTHORIZATION_CONSUMED=NO\n'
              printf 'SECRET_PUT_STARTED=NO\n'
              printf 'SECRET_MUTATION=NO\n'
              printf 'NO_RETRY_ROLLBACK_CLEANUP=YES\n'
            } >&2
            exit 1
          }

          for cmd in curl jq; do
            command -v "$cmd" >/dev/null 2>&1 || stop_pre "MISSING_${cmd^^}"
          done

          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || stop_pre WORKFLOW_EVENT_NOT_DISPATCH
          [ "${GITHUB_REF_NAME:-}" = "main" ] || stop_pre WORKFLOW_REF_NOT_MAIN
          [ "${GITHUB_RUN_ATTEMPT:-}" = "1" ] || stop_pre WORKFLOW_ATTEMPT_NOT_ONE
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || stop_pre WORKFLOW_SHA_INVALID
          [ -n "${GITHUB_TOKEN:-}" ] || stop_pre MISSING_GITHUB_TOKEN
          [ -n "${SECRET_ADMIN_TOKEN:-}" ] || stop_pre MISSING_SECRET_ADMIN_TOKEN
          [ -n "${OWNER_AUTHORIZATION:-}" ] || stop_pre OWNER_AUTHORIZATION_MISSING
          [ -n "${ENCRYPTED_VALUE:-}" ] || stop_pre ENCRYPTED_VALUE_MISSING
          [ -n "${KEY_ID:-}" ] || stop_pre KEY_ID_MISSING

          printf '::add-mask::%s\n' "$SECRET_ADMIN_TOKEN"
          printf '::add-mask::%s\n' "$OWNER_AUTHORIZATION"
          printf '::add-mask::%s\n' "$ENCRYPTED_VALUE"
          printf '::add-mask::%s\n' "$KEY_ID"

          expected_auth="AUTHORIZE_WORKER_DEPLOY_SECRET_RECOVERY:${GITHUB_SHA}:${TARGET_ENVIRONMENT}:${TARGET_SECRET}:PUT1:NO-RETRY"
          [ "$OWNER_AUTHORIZATION" = "$expected_auth" ] || stop_pre OWNER_AUTHORIZATION_INVALID

          jq -e '
            .version == 1 and
            .target.repository == "rozkalnsandris/rozkalns-control-center" and
            .target.environment == "production-worker-deploy" and
            .target.secret == "CONTROL_ACCESS_CLIENT_SECRET" and
            .source_policy.dispatch_ref == "main" and
            .source_policy.exact_main_sha_required == true and
            .source_policy.owner_authorization_required == true and
            .input_policy.plaintext_secret_forbidden == true and
            .input_policy.encrypted_value_required == true and
            .input_policy.key_id_required == true and
            .input_policy.current_key_id_match_required == true and
            .mutation_policy.maximum_put_requests == 1 and
            .mutation_policy.retry_after_put_started == false and
            .mutation_policy.rollback_after_put_started == false and
            .mutation_policy.cleanup_after_put_started == false and
            .mutation_policy.fail_closed_on_ambiguous_result == true
          ' "$RECOVERY_CONTRACT" >/dev/null || stop_pre RECOVERY_CONTRACT_INVALID

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          github_get() {
            local token="$1" path="$2" out="$3"
            curl -fsS --retry 0 --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${CONTROL_REPO}${path}" > "$out" || stop_pre GITHUB_GET_FAILED
          }

          github_get "$GITHUB_TOKEN" '/branches/main' "$tmp/main.json"
          jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha' "$tmp/main.json" >/dev/null || stop_pre MAIN_SHA_DRIFT

          github_get "$SECRET_ADMIN_TOKEN" "/environments/${TARGET_ENVIRONMENT}/secrets/public-key" "$tmp/public-key.json"
          current_key_id="$(jq -er '.key_id | select(type == "string" and length > 0)' "$tmp/public-key.json" 2>/dev/null)" || stop_pre PUBLIC_KEY_ID_INVALID
          printf '::add-mask::%s\n' "$current_key_id"
          [ "$current_key_id" = "$KEY_ID" ] || stop_pre PUBLIC_KEY_ID_DRIFT

          github_get "$SECRET_ADMIN_TOKEN" "/environments/${TARGET_ENVIRONMENT}/secrets/${TARGET_SECRET}" "$tmp/secret.json"
          jq -e --arg name "$TARGET_SECRET" '.name == $name' "$tmp/secret.json" >/dev/null || stop_pre TARGET_SECRET_NOT_FOUND

          payload="$tmp/payload.json"
          jq -n --arg encrypted_value "$ENCRYPTED_VALUE" --arg key_id "$KEY_ID" \
            '{encrypted_value:$encrypted_value,key_id:$key_id}' > "$payload" || stop_pre PAYLOAD_BUILD_FAILED

          {
            printf 'WORKER_DEPLOY_SECRET_RECOVERY_PREFLIGHT=PASS\n'
            printf 'TARGET_ENVIRONMENT=%s\n' "$TARGET_ENVIRONMENT"
            printf 'TARGET_SECRET=%s\n' "$TARGET_SECRET"
            printf 'AUTHORIZATION_CONSUMED=NO\n'
            printf 'SECRET_PUT_STARTED=NO\n'
            printf 'SECRET_MUTATION=NO\n'
          }

          printf 'SECRET_PUT_STARTED=YES\n'
          printf 'AUTHORIZATION_CONSUMED=YES\n'

          response_headers="$tmp/put.headers"
          set +e
          http_code="$(curl -sS --retry 0 --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
            -o /dev/null -D "$response_headers" -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${SECRET_ADMIN_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${CONTROL_REPO}/environments/${TARGET_ENVIRONMENT}/secrets/${TARGET_SECRET}" \
            --data-binary "@${payload}")"
          curl_rc=$?
          set -e

          if [ "$curl_rc" -ne 0 ]; then
            {
              printf 'WORKER_DEPLOY_SECRET_RECOVERY=STOP\n'
              printf 'STOP=SECRET_PUT_RESULT_UNCERTAIN\n'
              printf 'AUTHORIZATION_CONSUMED=YES\n'
              printf 'SECRET_PUT_STARTED=YES\n'
              printf 'SECRET_MUTATION=UNKNOWN_AFTER_PUT\n'
              printf 'NO_RETRY_ROLLBACK_CLEANUP=YES\n'
            } >&2
            exit 1
          fi

          if [ "$http_code" != "204" ]; then
            {
              printf 'WORKER_DEPLOY_SECRET_RECOVERY=STOP\n'
              printf 'STOP=SECRET_PUT_UNEXPECTED_HTTP_%s\n' "$http_code"
              printf 'AUTHORIZATION_CONSUMED=YES\n'
              printf 'SECRET_PUT_STARTED=YES\n'
              printf 'SECRET_MUTATION=YES_OR_UNCERTAIN\n'
              printf 'NO_RETRY_ROLLBACK_CLEANUP=YES\n'
            } >&2
            exit 1
          fi

          printf 'WORKER_DEPLOY_SECRET_RECOVERY=PASS\n'
          printf 'SECRET_MUTATION=YES\n'
          printf 'SECRET_PUT_COUNT=1\n'
          printf 'NO_RETRY_ROLLBACK_CLEANUP=YES\n'
          printf 'NEXT=DEPLOY_ENVIRONMENT_GET_ONLY_VERIFICATION\n'
