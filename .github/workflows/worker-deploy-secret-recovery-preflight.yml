name: Worker deploy secret recovery preflight

on:
  workflow_dispatch:
    inputs:
      owner_authorization:
        description: Exact source-only recovery authorization binding
        required: true
        type: string
      encrypted_value:
        description: GitHub environment-public-key encrypted secret value
        required: true
        type: string
      key_id:
        description: GitHub environment public key id used for encryption
        required: true
        type: string

permissions:
  contents: read

env:
  RECOVERY_CONTRACT: .github/worker-deploy-secret-recovery.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate recovery contract and dispatch binding
        shell: bash
        env:
          OWNER_AUTHORIZATION: ${{ inputs.owner_authorization }}
          ENCRYPTED_VALUE: ${{ inputs.encrypted_value }}
          KEY_ID: ${{ inputs.key_id }}
        run: |
          set -euo pipefail

          stop() {
            printf 'WORKER_DEPLOY_SECRET_RECOVERY_PREFLIGHT=STOP\n' >&2
            printf 'STOP=%s\n' "$1" >&2
            printf 'SECRET_MUTATION=NO\n' >&2
            exit 1
          }

          command -v jq >/dev/null 2>&1 || stop MISSING_JQ
          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || stop WORKFLOW_EVENT_NOT_DISPATCH
          [ "${GITHUB_REF_NAME:-}" = "main" ] || stop WORKFLOW_REF_NOT_MAIN
          [ "${GITHUB_RUN_ATTEMPT:-}" = "1" ] || stop WORKFLOW_ATTEMPT_NOT_ONE
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || stop WORKFLOW_SHA_INVALID

          [ -n "${OWNER_AUTHORIZATION:-}" ] || stop OWNER_AUTHORIZATION_MISSING
          [ -n "${ENCRYPTED_VALUE:-}" ] || stop ENCRYPTED_VALUE_MISSING
          [ -n "${KEY_ID:-}" ] || stop KEY_ID_MISSING
          printf '::add-mask::%s\n' "$OWNER_AUTHORIZATION"
          printf '::add-mask::%s\n' "$ENCRYPTED_VALUE"
          printf '::add-mask::%s\n' "$KEY_ID"

          expected_auth="AUTHORIZE_WORKER_DEPLOY_SECRET_RECOVERY_PREFLIGHT:${GITHUB_SHA}:production-worker-deploy:CONTROL_ACCESS_CLIENT_SECRET"
          [ "$OWNER_AUTHORIZATION" = "$expected_auth" ] || stop OWNER_AUTHORIZATION_INVALID

          jq -e '
            .version == 1 and
            .target.repository == "rozkalnsandris/rozkalns-control-center" and
            .target.environment == "production-worker-deploy" and
            .target.secret == "CONTROL_ACCESS_CLIENT_SECRET" and
            .source_policy.dispatch_ref == "main" and
            .source_policy.exact_main_sha_required == true and
            .source_policy.owner_authorization_required == true and
            .input_policy.plaintext_secret_forbidden == true and
            .input_policy.encrypted_value_required == true and
            .input_policy.key_id_required == true and
            .input_policy.current_key_id_match_required == true and
            .mutation_policy.maximum_put_requests == 1 and
            .mutation_policy.retry_after_put_started == false and
            .mutation_policy.rollback_after_put_started == false and
            .mutation_policy.cleanup_after_put_started == false and
            .mutation_policy.fail_closed_on_ambiguous_result == true
          ' "$RECOVERY_CONTRACT" >/dev/null || stop RECOVERY_CONTRACT_INVALID

          printf 'WORKER_DEPLOY_SECRET_RECOVERY_PREFLIGHT=PASS\n'
          printf 'TARGET_ENVIRONMENT=production-worker-deploy\n'
          printf 'TARGET_SECRET=CONTROL_ACCESS_CLIENT_SECRET\n'
          printf 'SECRET_MUTATION=NO\n'
          printf 'NEXT=SEPARATELY_AUTHORIZED_SECRET_UPDATE_IMPLEMENTATION\n'
