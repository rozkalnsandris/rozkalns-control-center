name: Continuation Access provision one-shot

on:
  workflow_dispatch:
    inputs:
      owner_authorization:
        description: Exact owner authorization bound to main, CI, GET-only preflight, selected IdP, frozen digest, and one app POST
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: continuation-access-provision-one-shot
  cancel-in-progress: false

jobs:
  provision:
    name: create exactly one owner continuation Access app with one inline policy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: production-readonly-reconcile
      deployment: false
    env:
      CONTROL_REPO: rozkalnsandris/rozkalns-control-center
      CF_ACCOUNT_ID: 70e29dbca0e8363358659102d2b74178
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
      CLOUDFLARE_ACCESS_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_WRITE_TOKEN }}
      CONTROL_CONTINUATION_OWNER_EMAIL: ${{ secrets.CONTROL_CONTINUATION_OWNER_EMAIL }}

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Revalidate evidence and apply exactly one Access app POST
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mutation_started=NO

          stop() {
            if [ "$mutation_started" = YES ]; then
              {
                printf 'CONTINUATION_ACCESS_PROVISION=STOP\n'
                printf 'STOP=%s\n' "$1"
                printf 'AUTHORIZATION_CONSUMED=YES\n'
                printf 'ACCESS_APP_POST_STARTED=YES\n'
                printf 'CLOUDFLARE_ACCESS_MUTATION=YES_OR_UNCERTAIN\n'
                printf 'NO_RETRY_ROLLBACK_CLEANUP=YES\n'
              } >&2
            else
              {
                printf 'CONTINUATION_ACCESS_PROVISION=STOP\n'
                printf 'STOP=%s\n' "$1"
                printf 'AUTHORIZATION_CONSUMED=NO\n'
                printf 'ACCESS_APP_POST_STARTED=NO\n'
                printf 'CLOUDFLARE_ACCESS_MUTATION=NO\n'
                printf 'NO_RETRY_ROLLBACK_CLEANUP=YES\n'
              } >&2
            fi
            exit 1
          }

          for cmd in curl jq node sed tr wc grep; do
            command -v "$cmd" >/dev/null 2>&1 || stop "MISSING_${cmd^^}"
          done
          [ -n "${GITHUB_EVENT_PATH:-}" ] || stop MISSING_GITHUB_EVENT_PATH
          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || stop WORKFLOW_EVENT_NOT_DISPATCH
          [ "${GITHUB_REF_NAME:-}" = "main" ] || stop WORKFLOW_REF_NOT_MAIN
          [ "${GITHUB_RUN_ATTEMPT:-}" = "1" ] || stop WORKFLOW_ATTEMPT_NOT_ONE
          [ -n "${GITHUB_TOKEN:-}" ] || stop MISSING_GITHUB_TOKEN
          [ -n "${CLOUDFLARE_ACCESS_READ_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_ACCESS_READ_TOKEN
          [ -n "${CLOUDFLARE_ACCESS_WRITE_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_ACCESS_WRITE_TOKEN
          [ -n "${CONTROL_CONTINUATION_OWNER_EMAIL:-}" ] || stop MISSING_CONTROL_CONTINUATION_OWNER_EMAIL
          printf '::add-mask::%s\n' "$CONTROL_CONTINUATION_OWNER_EMAIL"

          owner_authorization="$(jq -er '.inputs.owner_authorization | select(type == "string" and length > 0)' "$GITHUB_EVENT_PATH" 2>/dev/null)" || stop OWNER_AUTHORIZATION_MISSING
          printf '::add-mask::%s\n' "$owner_authorization"
          authorization_pattern='^AUTHORIZE_CONTINUATION_ACCESS_PROVISION:([0-9a-f]{40}):([1-9][0-9]*):([1-9][0-9]*):([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}):([0-9a-f]{64}):POST1:NO_RETRY:NO_ROLLBACK:NO_CLEANUP$'
          [[ "$owner_authorization" =~ $authorization_pattern ]] || stop OWNER_AUTHORIZATION_INVALID
          approved_sha="${BASH_REMATCH[1]}"
          expected_ci_run_id="${BASH_REMATCH[2]}"
          expected_preflight_run_id="${BASH_REMATCH[3]}"
          expected_idp_id="${BASH_REMATCH[4]}"
          expected_digest="${BASH_REMATCH[5]}"
          [ "${GITHUB_SHA:-}" = "$approved_sha" ] || stop WORKFLOW_SHA_NOT_APPROVED

          tmp="${RUNNER_TEMP}/continuation-access-provision-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$tmp"

          gh_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${CONTROL_REPO}${path}" > "$out" || stop GITHUB_GET_FAILED
          }

          cf_read_array_page() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_ACCESS_READ_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_ACCESS_GET_FAILED
            jq -e '.success == true and (.result | type == "array")' "$out" >/dev/null || stop CLOUDFLARE_ACCESS_ARRAY_RESPONSE_INVALID
          }

          cf_read_object() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_ACCESS_READ_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_ACCESS_GET_FAILED
            jq -e '.success == true and (.result | type == "object")' "$out" >/dev/null || stop CLOUDFLARE_ACCESS_OBJECT_RESPONSE_INVALID
          }

          fetch_paginated_array() {
            local base_path="$1" output="$2" label="$3"
            local page=1 page_file count
            : > "$tmp/${label}.ndjson"
            while :; do
              [ "$page" -le 10 ] || stop "${label^^}_PAGINATION_LIMIT"
              page_file="$tmp/${label}-${page}.json"
              cf_read_array_page "${base_path}?per_page=100&page=${page}" "$page_file"
              jq -c '.result[]?' "$page_file" >> "$tmp/${label}.ndjson"
              count="$(jq '.result | length' "$page_file")"
              [[ "$count" =~ ^[0-9]+$ ]] || stop "${label^^}_PAGE_COUNT_INVALID"
              [ "$count" -lt 100 ] && break
              page=$((page + 1))
            done
            jq -s '.' "$tmp/${label}.ndjson" > "$output"
          }

          inventory_snapshot() {
            local prefix="$1"
            fetch_paginated_array '/access/apps' "$tmp/${prefix}-apps.json" "${prefix}-apps"
            local app_count total_policy_count app_id policy_count
            app_count="$(jq 'length' "$tmp/${prefix}-apps.json")"
            [[ "$app_count" =~ ^[0-9]+$ ]] || stop ACCESS_APP_COUNT_INVALID
            [ "$app_count" -le 100 ] || stop ACCESS_APP_COUNT_UNBOUNDED
            printf '{}' > "$tmp/${prefix}-policies.json"
            total_policy_count=0
            while IFS= read -r app_id; do
              [[ "$app_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || stop ACCESS_APP_ID_INVALID
              fetch_paginated_array "/access/apps/${app_id}/policies" "$tmp/${prefix}-app-policies.json" "${prefix}-policies-${app_id}"
              policy_count="$(jq 'length' "$tmp/${prefix}-app-policies.json")"
              [[ "$policy_count" =~ ^[0-9]+$ ]] || stop ACCESS_POLICY_COUNT_INVALID
              [ "$policy_count" -le 100 ] || stop ACCESS_POLICY_COUNT_UNBOUNDED
              total_policy_count=$((total_policy_count + policy_count))
              [ "$total_policy_count" -le 1000 ] || stop ACCESS_POLICY_TOTAL_COUNT_UNBOUNDED
              jq --arg id "$app_id" --slurpfile policies "$tmp/${prefix}-app-policies.json" '. + {($id): $policies[0]}' "$tmp/${prefix}-policies.json" > "$tmp/${prefix}-policies.next.json"
              mv "$tmp/${prefix}-policies.next.json" "$tmp/${prefix}-policies.json"
            done < <(jq -r '.[].id' "$tmp/${prefix}-apps.json")
          }

          printf '%s\n' STAGE=BOUND_GITHUB_EVIDENCE
          gh_get '/branches/main' "$tmp/main.json"
          jq -e --arg sha "$approved_sha" '.commit.sha == $sha' "$tmp/main.json" >/dev/null || stop MAIN_SHA_DRIFT
          gh_get "/actions/runs/${expected_ci_run_id}" "$tmp/ci.json"
          jq -e --arg sha "$approved_sha" --argjson id "$expected_ci_run_id" '.id == $id and .name == "CI" and .path == ".github/workflows/ci.yml" and .head_branch == "main" and .head_sha == $sha and .event == "push" and .run_attempt == 1 and .status == "completed" and .conclusion == "success"' "$tmp/ci.json" >/dev/null || stop EXACT_MAIN_CI_NOT_PASS
          gh_get "/actions/runs/${expected_preflight_run_id}" "$tmp/preflight-run.json"
          jq -e --arg sha "$approved_sha" --argjson id "$expected_preflight_run_id" '.id == $id and .name == "Continuation Access read-only preflight" and .path == ".github/workflows/continuation-access-readonly-preflight.yml" and .head_branch == "main" and .head_sha == $sha and .event == "workflow_dispatch" and .run_attempt == 1 and .status == "completed" and .conclusion == "success"' "$tmp/preflight-run.json" >/dev/null || stop PREFLIGHT_RUN_INVALID
          gh_get "/actions/runs/${expected_preflight_run_id}/jobs?per_page=100" "$tmp/preflight-jobs.json"
          preflight_job_id="$(jq -er '[.jobs[] | select(.name == "prove continuation Access target vacancy and freeze non-target state" and .status == "completed" and .conclusion == "success")] | select(length == 1) | .[0].id' "$tmp/preflight-jobs.json" 2>/dev/null)" || stop PREFLIGHT_JOB_INVALID
          curl -fsSL --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${CONTROL_REPO}/actions/jobs/${preflight_job_id}/logs" > "$tmp/preflight.log" || stop PREFLIGHT_LOG_READ_FAILED
          grep -F 'CONTINUATION_ACCESS_PREFLIGHT=PASS' "$tmp/preflight.log" >/dev/null || stop PREFLIGHT_PASS_NOT_BOUND
          grep -F "SOURCE_SHA=${approved_sha}" "$tmp/preflight.log" >/dev/null || stop PREFLIGHT_SHA_NOT_BOUND
          grep -F "CI_RUN_ID=${expected_ci_run_id}" "$tmp/preflight.log" >/dev/null || stop PREFLIGHT_CI_NOT_BOUND
          grep -F "IDP_ID=${expected_idp_id}" "$tmp/preflight.log" >/dev/null || stop PREFLIGHT_IDP_NOT_BOUND
          grep -F "NON_TARGET_DIGEST=${expected_digest}" "$tmp/preflight.log" >/dev/null || stop PREFLIGHT_DIGEST_NOT_BOUND
          grep -F 'CONFLICT_COUNT=0' "$tmp/preflight.log" >/dev/null || stop PREFLIGHT_CONFLICT_STATE_INVALID
          grep -F 'ACCESS_API_METHOD=GET_ONLY' "$tmp/preflight.log" >/dev/null || stop PREFLIGHT_METHOD_INVALID
          grep -F 'PRODUCTION_MUTATIONS=0' "$tmp/preflight.log" >/dev/null || stop PREFLIGHT_MUTATION_STATE_INVALID
          expected_issuer="$(grep -F 'ACCESS_ISSUER=' "$tmp/preflight.log" | tail -n 1 | sed 's/^.*ACCESS_ISSUER=//')"
          [[ "$expected_issuer" =~ ^https://[A-Za-z0-9.-]+\.cloudflareaccess\.com$ ]] || stop PREFLIGHT_ISSUER_INVALID

          printf '%s\n' STAGE=FRESH_GET_ONLY_REVALIDATION
          inventory_snapshot before
          fetch_paginated_array '/access/identity_providers' "$tmp/idps.json" before-idps
          cf_read_object '/access/organizations' "$tmp/organization.json"
          jq '.result' "$tmp/organization.json" > "$tmp/organization-result.json"
          set +e
          fresh_proof="$(node scripts/continuation-access-provisioning.mjs preflight "$tmp/before-apps.json" "$tmp/before-policies.json" "$tmp/idps.json" "$tmp/organization-result.json" "$expected_idp_id")"
          fresh_rc=$?
          set -e
          [ "$fresh_rc" -eq 0 ] || stop FRESH_PREFLIGHT_CONTRACT_REJECTED
          jq -e --arg digest "$expected_digest" --arg issuer "$expected_issuer" '.status == "PASS" and .conflictCount == 0 and .nonTargetDigest == $digest and .issuer == $issuer' <<<"$fresh_proof" >/dev/null || stop FRESH_PREFLIGHT_DRIFT

          curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_ACCESS_WRITE_TOKEN}" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps?per_page=1&page=1" > "$tmp/write-token-readcheck.json" || stop ACCESS_WRITE_TOKEN_GET_FAILED
          jq -e '.success == true and (.result | type == "array")' "$tmp/write-token-readcheck.json" >/dev/null || stop ACCESS_WRITE_TOKEN_GET_INVALID

          node scripts/continuation-access-provisioning.mjs payload "$expected_idp_id" "$tmp/create-payload.json" >/dev/null || stop ACCESS_CREATE_PAYLOAD_REJECTED
          jq -e '.name == "Rozkalns Control owner continuation" and .type == "self_hosted" and (.destinations | length == 2) and (.policies | length == 1) and .policies[0].decision == "allow" and (.policies[0].include | length == 1)' "$tmp/create-payload.json" >/dev/null || stop ACCESS_CREATE_PAYLOAD_INVALID

          gh_get '/branches/main' "$tmp/main-final.json"
          jq -e --arg sha "$approved_sha" '.commit.sha == $sha' "$tmp/main-final.json" >/dev/null || stop MAIN_SHA_DRIFT_BEFORE_POST

          printf '%s\n' STAGE=AUTHORIZED_SINGLE_POST
          mutation_started=YES
          set +e
          post_status="$(curl -sS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
            -o "$tmp/create-response.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_ACCESS_WRITE_TOKEN}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary "@$tmp/create-payload.json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps")"
          post_rc=$?
          set -e
          [ "$post_rc" -eq 0 ] || stop ACCESS_APP_POST_TRANSPORT_FAILURE
          [[ "$post_status" =~ ^20[01]$ ]] || stop ACCESS_APP_POST_HTTP_FAILURE
          jq -e '.success == true and (.result | type == "object")' "$tmp/create-response.json" >/dev/null || stop ACCESS_APP_POST_RESPONSE_INVALID
          created_app_id="$(jq -er '.result.id | select(type == "string")' "$tmp/create-response.json" 2>/dev/null)" || stop ACCESS_CREATED_APP_ID_MISSING
          [[ "$created_app_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || stop ACCESS_CREATED_APP_ID_INVALID

          printf '%s\n' STAGE=POST_GET_VERIFICATION
          inventory_snapshot after
          cf_read_object '/access/organizations' "$tmp/organization-after.json"
          jq '.result' "$tmp/organization-after.json" > "$tmp/organization-after-result.json"
          set +e
          postflight="$(node scripts/continuation-access-provisioning.mjs postflight "$tmp/after-apps.json" "$tmp/after-policies.json" "$created_app_id" "$expected_idp_id" "$tmp/organization-after-result.json" "$expected_digest" "$tmp/create-response.json")"
          postflight_rc=$?
          set -e
          [ "$postflight_rc" -eq 0 ] || stop ACCESS_POSTFLIGHT_CONTRACT_REJECTED
          jq -e --arg issuer "$expected_issuer" --arg digest "$expected_digest" '.status == "PASS" and .issuer == $issuer and .nonTargetDigest == $digest and (.audience | test("^[A-Za-z0-9_-]{1,64}$"))' <<<"$postflight" >/dev/null || stop ACCESS_POSTFLIGHT_PROOF_INVALID

          created_aud="$(jq -r '.audience' <<<"$postflight")"
          created_policy_id="$(jq -r '.policyId' <<<"$postflight")"
          printf 'CONTINUATION_ACCESS_PROVISION=PASS\n'
          printf 'AUTHORIZATION_CONSUMED=YES\n'
          printf 'SOURCE_SHA=%s\n' "$approved_sha"
          printf 'CI_RUN_ID=%s\n' "$expected_ci_run_id"
          printf 'PREFLIGHT_RUN_ID=%s\n' "$expected_preflight_run_id"
          printf 'IDP_ID=%s\n' "$expected_idp_id"
          printf 'ACCESS_ISSUER=%s\n' "$expected_issuer"
          printf 'NON_TARGET_DIGEST=%s\n' "$expected_digest"
          printf 'APP_ID=%s\n' "$created_app_id"
          printf 'APP_AUD=%s\n' "$created_aud"
          printf 'POLICY_ID=%s\n' "$created_policy_id"
          printf 'OWNER_SELECTOR=EXACT_PRIVATE_EMAIL\n'
          printf 'ACCESS_APP_POST_STARTED=YES\n'
          printf 'ACCESS_APP_POST_HTTP_STATUS=%s\n' "$post_status"
          printf 'CLOUDFLARE_ACCESS_MUTATION=ONE_APP_CREATE_POST_WITH_ONE_INLINE_POLICY\n'
          printf 'NO_RETRY_ROLLBACK_CLEANUP=YES\n'
