name: Phase 3 production read-only reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase3-production-readonly-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile production read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-readonly-reconcile
    env:
      CONTROL_REPO: rozkalnsandris/rozkalns-control-center
      CF_ACCOUNT_ID: 70e29dbca0e8363358659102d2b74178
      WORKER_NAME: rozkalns-control
      EXPECTED_PRE_VERSION: 744b3cb5-7c08-4aae-a217-a9fec81f27b2
      EXPECTED_PRE_DEPLOYMENT: 4a1582f5-5f18-423d-b610-ac51c13c5f5a
      EXPECTED_NEW_VERSION: f6dbb1c9-71d6-4665-b9b9-cb87dc99ccc7
      EXPECTED_NEW_DEPLOYMENT: 68041aea-8757-4c4e-8b29-b96902f03a00
      HOSTNAME: control.rozkalns.net
      EXPECTED_DOMAIN_ID: ac685929d45e825df5b5f6b803a9814b6dbf5d9d
      DB_ID: 8504e986-faf0-450c-bfb5-41b5dbf8be09
      TARGET_REPO: rozkalnsandris/ops-workflows
      TARGET_ISSUE: "4"
      TARGET_PULL: "3"
      TARGET_HEAD_SHA: d4c5b27e2b32d89447fe3ea1acdde9d2d2a7672e
      TARGET_MAIN_SHA: e2fa7ecb1b1cdfab0711d8e3e147b5ae03a9a3f2
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
      CONTROL_ACCESS_CLIENT_SECRET: ${{ secrets.CONTROL_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Reconcile already-deployed production state
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          stop() {
            {
              printf 'PHASE254_GITHUB_RECONCILIATION=STOP\n'
              printf 'STOP=%s\n' "$1"
              printf 'CLOUDFLARE_MUTATION=NO\n'
              printf 'DEPLOY_RETRY=FORBIDDEN\n'
              printf 'AUTHORIZATION_CONSUMED=YES\n'
            } >&2
            exit 1
          }

          for cmd in curl jq grep cut tr wc; do
            command -v "$cmd" >/dev/null 2>&1 || stop "MISSING_${cmd^^}"
          done

          [ -n "${GITHUB_TOKEN:-}" ] || stop MISSING_GITHUB_TOKEN
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_API_TOKEN
          [ -n "${CONTROL_ACCESS_CLIENT_ID:-}" ] || stop MISSING_CONTROL_ACCESS_CLIENT_ID
          [ -n "${CONTROL_ACCESS_CLIENT_SECRET:-}" ] || stop MISSING_CONTROL_ACCESS_CLIENT_SECRET

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          gh_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${CONTROL_REPO}${path}" > "$out" || stop GITHUB_GET_FAILED
          }

          cf_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_GET_FAILED
            jq -e '.success == true' "$out" >/dev/null || stop CLOUDFLARE_RESPONSE_INVALID
          }

          access_header_value() {
            local header_name="$1" header_file="$2" line
            line="$(grep -i -m1 "^${header_name}:" "$header_file" 2>/dev/null || true)"
            line="${line#*:}"
            line="${line//$'\r'/}"
            line="${line//$'\n'/}"
            line="${line#"${line%%[![:space:]]*}"}"
            LC_ALL=C printf '%s' "$line" | tr -cd '[:print:]' | cut -c1-160
          }

          emit_access_diagnostics() {
            local status="$1" headers="$2" out="$3" body_bytes
            body_bytes=0
            if [ -f "$out" ]; then
              body_bytes="$(wc -c < "$out" | tr -d '[:space:]')"
            fi
            {
              printf 'ACCESS_OBSERVED_HTTP_STATUS=%s\n' "$status"
              printf 'ACCESS_OBSERVED_CF_RAY=%s\n' "$(access_header_value 'cf-ray' "$headers")"
              printf 'ACCESS_OBSERVED_SERVER=%s\n' "$(access_header_value 'server' "$headers")"
              printf 'ACCESS_OBSERVED_CONTENT_TYPE=%s\n' "$(access_header_value 'content-type' "$headers")"
              printf 'ACCESS_OBSERVED_CF_MITIGATED=%s\n' "$(access_header_value 'cf-mitigated' "$headers")"
              printf 'ACCESS_OBSERVED_BODY_BYTES=%s\n' "$body_bytes"
            } >&2
          }

          access_get() {
            local path="$1" out="$2" status headers
            headers="${out}.headers"
            status="$(curl -sS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "CF-Access-Client-Id: ${CONTROL_ACCESS_CLIENT_ID}" \
              -H "CF-Access-Client-Secret: ${CONTROL_ACCESS_CLIENT_SECRET}" \
              -H 'Accept: application/json' \
              -D "$headers" -o "$out" -w '%{http_code}' "https://${HOSTNAME}${path}")" || stop ACCESS_GET_FAILED
            if [ "$status" != "200" ]; then
              emit_access_diagnostics "$status" "$headers" "$out"
              stop "ACCESS_HTTP_${status}"
            fi
            jq -e 'type == "object"' "$out" >/dev/null || stop ACCESS_RESPONSE_NOT_JSON_OBJECT
            printf '%s' "$status"
          }

          printf '%s\n' STAGE=GITHUB_SOURCE_CI_RECHECK
          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || stop WORKFLOW_EVENT_NOT_DISPATCH
          [ "${GITHUB_REF_NAME:-}" = "main" ] || stop WORKFLOW_REF_NOT_MAIN
          run_sha="${GITHUB_SHA:-}"
          [ -n "$run_sha" ] || stop WORKFLOW_SHA_MISSING

          gh_get '/branches/main' "$tmp/main.json"
          jq -e --arg sha "$run_sha" '.commit.sha == $sha' "$tmp/main.json" >/dev/null || stop MAIN_SHA_DRIFT

          gh_get "/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${run_sha}&per_page=10" "$tmp/ci-runs.json"
          ci_run_id="$(
            jq -r --arg sha "$run_sha" '
              [
                .workflow_runs[]?
                | select(
                    .name == "CI" and
                    .head_branch == "main" and
                    .head_sha == $sha and
                    .event == "push" and
                    .status == "completed" and
                    .conclusion == "success"
                  )
              ]
              | sort_by(.run_number)
              | last
              | .id // empty
            ' "$tmp/ci-runs.json"
          )"
          [ -n "$ci_run_id" ] || stop EXACT_MAIN_CI_NOT_SUCCESS

          gh_get "/actions/runs/${ci_run_id}" "$tmp/ci.json"
          jq -e --arg sha "$run_sha" --argjson id "$ci_run_id" '
            .id == $id and .name == "CI" and .head_branch == "main" and .head_sha == $sha and
            .event == "push" and .status == "completed" and .conclusion == "success"
          ' "$tmp/ci.json" >/dev/null || stop EXACT_MAIN_CI_DRIFT

          printf '%s\n' STAGE=CLOUDFLARE_ACTIVE_DEPLOYMENT
          cf_get "/workers/scripts/${WORKER_NAME}/deployments" "$tmp/deployments.json"
          current_deployment="$(jq -r '.result.deployments[0].id // empty' "$tmp/deployments.json")"
          current_version="$(jq -r '.result.deployments[0].versions[0].version_id // empty' "$tmp/deployments.json")"
          current_percentage="$(jq -r '.result.deployments[0].versions[0].percentage // empty' "$tmp/deployments.json")"
          current_created_on="$(jq -r '(.result.deployments[0].created_on // "unknown") | tostring | @json | .[0:160]' "$tmp/deployments.json")"
          current_source="$(jq -r '(.result.deployments[0].source // "unknown") | tostring | @json | .[0:160]' "$tmp/deployments.json")"
          current_triggered_by="$(jq -r '(.result.deployments[0].annotations["workers/triggered_by"] // "unknown") | tostring | @json | .[0:160]' "$tmp/deployments.json")"

          printf 'OBSERVED_DEPLOYMENT_ID=%s\n' "$current_deployment"
          printf 'OBSERVED_VERSION_ID=%s\n' "$current_version"
          printf 'OBSERVED_TRAFFIC_PERCENT=%s\n' "$current_percentage"
          printf 'OBSERVED_DEPLOYMENT_CREATED_ON=%s\n' "$current_created_on"
          printf 'OBSERVED_DEPLOYMENT_SOURCE=%s\n' "$current_source"
          printf 'OBSERVED_DEPLOYMENT_TRIGGERED_BY=%s\n' "$current_triggered_by"

          [ -n "$current_deployment" ] || stop POST_DEPLOYMENT_ID_MISSING
          [ "$current_deployment" != "$EXPECTED_PRE_DEPLOYMENT" ] || stop ACTIVE_DEPLOYMENT_STILL_PRE_DEPLOYMENT
          [ "$current_deployment" = "$EXPECTED_NEW_DEPLOYMENT" ] || stop ACTIVE_DEPLOYMENT_NOT_ACCEPTED_DEPLOYMENT
          [ "$current_version" = "$EXPECTED_NEW_VERSION" ] || stop ACTIVE_VERSION_NOT_WRANGLER_OBSERVED_VERSION
          [ "$current_version" != "$EXPECTED_PRE_VERSION" ] || stop ACTIVE_VERSION_STILL_PRE_VERSION
          [ "$current_percentage" = "100" ] || stop ACTIVE_TRAFFIC_NOT_100_PERCENT

          jq -e '
            (.result.deployments | type == "array") and
            (.result.deployments | length >= 1) and
            (.result.deployments[0].versions | type == "array") and
            (.result.deployments[0].versions | length == 1) and
            .result.deployments[0].versions[0].percentage == 100
          ' "$tmp/deployments.json" >/dev/null || stop ACTIVE_DEPLOYMENT_NOT_SINGLE_VERSION_100_PERCENT

          printf '%s\n' STAGE=CLOUDFLARE_VERSION_BINDINGS_DOMAIN
          cf_get "/workers/scripts/${WORKER_NAME}/versions/${current_version}" "$tmp/version.json"
          jq -e --arg ver "$current_version" --arg db "$DB_ID" '
            .result.id == $ver and
            ((.result.resources.bindings // []) as $b |
              ($b | type == "array") and
              any($b[]; .name == "GITHUB_APP_PRIVATE_KEY_PEM" and (.type == "secret_text" or .type == "secret_key")) and
              any($b[]; .name == "GITHUB_WEBHOOK_SECRET" and (.type == "secret_text" or .type == "secret_key")) and
              any($b[]; .name == "CONTROL_DB" and .type == "d1" and ((.database_id // .id // "") == $db)) and
              any($b[]; .name == "CONTROL_LIVE_READ_ENABLED" and .type == "plain_text" and .text == "true") and
              any($b[]; .name == "CONTROL_WEBHOOK_RUNTIME_ENABLED" and .type == "plain_text" and .text == "true")
            )
          ' "$tmp/version.json" >/dev/null || stop POST_VERSION_BINDING_IDENTITY_DRIFT

          cf_get "/workers/scripts/${WORKER_NAME}/subdomain" "$tmp/subdomain.json"
          jq -e '.result.enabled == false and .result.previews_enabled == false' "$tmp/subdomain.json" >/dev/null || stop POST_SUBDOMAIN_OR_PREVIEW_ENABLED

          cf_get "/workers/domains?service=${WORKER_NAME}&hostname=${HOSTNAME}" "$tmp/domains.json"
          jq -e --arg id "$EXPECTED_DOMAIN_ID" --arg host "$HOSTNAME" --arg service "$WORKER_NAME" '
            (.result | type == "array") and (.result | length == 1) and
            .result[0].id == $id and .result[0].hostname == $host and .result[0].service == $service
          ' "$tmp/domains.json" >/dev/null || stop POST_CUSTOM_DOMAIN_IDENTITY_DRIFT

          printf '%s\n' STAGE=ACCESS_GET_ONLY_RUNTIME
          health_http="$(access_get '/api/health' "$tmp/health.json")"
          jq -e --arg service "$WORKER_NAME" '.status == "ok" and .service == $service' "$tmp/health.json" >/dev/null || stop POST_HEALTH_INVALID
          dashboard_http="$(access_get '/api/github/dashboard' "$tmp/dashboard.json")"

          preflight_path="/api/github/needs-changes/preflight?repository=rozkalnsandris%2Fops-workflows&issue=${TARGET_ISSUE}&pull=${TARGET_PULL}"
          preflight_http="$(access_get "$preflight_path" "$tmp/preflight.json")"
          jq -e \
            --arg repo "$TARGET_REPO" \
            --argjson issue "$TARGET_ISSUE" \
            --argjson pull "$TARGET_PULL" \
            --arg head "$TARGET_HEAD_SHA" \
            --arg main "$TARGET_MAIN_SHA" '
              .kind == "PROJECTED" and
              .repository == $repo and .issueNumber == $issue and .pullNumber == $pull and
              .policy.coverage == "COMPLETE" and
              (.policy.blockedReasons | type == "array" and length == 0) and
              (.policy.sources | type == "array") and
              (.policy.sources | index("GITHUB_ACTIVE_RULES") != null) and
              (.policy.sources | index("GITHUB_CLASSIC_BRANCH_PROTECTION") != null) and
              .decision.currentHeadSha == $head and .decision.mainSha == $main
            ' "$tmp/preflight.json" >/dev/null || stop POST_PREFLIGHT_POLICY_NOT_COMPLETE_PROJECTED

          printf 'PHASE254_GITHUB_RECONCILIATION=PASS\n'
          printf 'SOURCE_SHA=%s\n' "$run_sha"
          printf 'CI_RUN_ID=%s\n' "$ci_run_id"
          printf 'NEW_VERSION=%s\n' "$current_version"
          printf 'NEW_DEPLOYMENT=%s\n' "$current_deployment"
          printf 'ACTIVE_TRAFFIC_PERCENT=%s\n' "$current_percentage"
          printf 'HEALTH_HTTP=%s\n' "$health_http"
          printf 'DASHBOARD_HTTP=%s\n' "$dashboard_http"
          printf 'PREFLIGHT_HTTP=%s\n' "$preflight_http"
          printf 'PREFLIGHT_KIND=PROJECTED\n'
          printf 'PREFLIGHT_POLICY_COVERAGE=COMPLETE\n'
          printf 'PREFLIGHT_HEAD_SHA=%s\n' "$TARGET_HEAD_SHA"
          printf 'PREFLIGHT_MAIN_SHA=%s\n' "$TARGET_MAIN_SHA"
          printf 'NEEDS_CHANGES_POST=NOT_CALLED\n'
          printf 'CLOUDFLARE_MUTATION=NO\n'
          printf 'DEPLOY_RETRY=FORBIDDEN\n'
          printf 'AUTHORIZATION_CONSUMED=YES\n'
