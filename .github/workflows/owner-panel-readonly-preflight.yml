name: Owner Action Panel read-only preflight

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Explicitly select the authorized read-only operation
        type: choice
        required: true
        default: none
        options:
          - none
          - token-analytics-proof
          - account-analytics-canary
          - inventory
          - health403-detail
          - health403-credential-effect
          - rotation-recovery-metadata
          - access-write-token-proof
          - access-write-token-kind

permissions:
  contents: read
  actions: read

concurrency:
  group: owner-panel-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production-readonly-reconcile
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Focused offline safety tests
        run: |
          python3 scripts/owner-panel-readonly-preflight.test.py
          python3 scripts/owner-panel-token-proof.test.py
          python3 scripts/owner-panel-token-proof-account-rate-message.test.py
          python3 scripts/owner-panel-token-proof-envelope.test.py
          python3 scripts/owner-panel-health403-detail.test.py
          python3 scripts/owner-panel-account-analytics-canary.test.py
          python3 scripts/owner-panel-health403-credential-effect.test.py
          python3 scripts/owner-panel-access-secret-rotation-recovery.test.py
          python3 scripts/owner-panel-access-write-token-proof.test.py
          python3 scripts/owner-panel-access-write-token-kind.test.py
      - name: Token Analytics permission proof only
        if: inputs.diagnostic == 'token-analytics-proof'
        env:
          CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
        run: python3 scripts/owner-panel-token-proof-envelope.py
      - name: Account Analytics permission canary only
        if: inputs.diagnostic == 'account-analytics-canary'
        env:
          CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
        run: python3 scripts/owner-panel-account-analytics-canary.py
      - name: Fixed-target read-only inventory
        if: inputs.diagnostic == 'inventory'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_WORKERS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
          CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
          CONTROL_ACCESS_CLIENT_SECRET: ${{ secrets.CONTROL_ACCESS_CLIENT_SECRET }}
        run: python3 scripts/owner-panel-readonly-preflight.py
      - name: Bounded health403 detail proof only
        if: inputs.diagnostic == 'health403-detail'
        env:
          CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
          CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
          CONTROL_ACCESS_CLIENT_SECRET: ${{ secrets.CONTROL_ACCESS_CLIENT_SECRET }}
        run: python3 scripts/owner-panel-health403-detail.py
      - name: Bounded health403 credential effect proof only
        if: inputs.diagnostic == 'health403-credential-effect'
        env:
          CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
          CONTROL_ACCESS_CLIENT_SECRET: ${{ secrets.CONTROL_ACCESS_CLIENT_SECRET }}
        run: python3 scripts/owner-panel-health403-credential-effect.py
      - name: Bounded Access rotation recovery metadata only
        if: inputs.diagnostic == 'rotation-recovery-metadata'
        env:
          CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
          CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
        run: python3 scripts/owner-panel-access-secret-rotation-recovery.py
      - name: Bounded Access write-token GET proof only
        if: inputs.diagnostic == 'access-write-token-proof'
        env:
          CLOUDFLARE_ACCESS_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_WRITE_TOKEN }}
          CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
          CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
        run: python3 scripts/owner-panel-access-write-token-proof.py
      - name: Bounded Access write-token ownership proof only
        if: inputs.diagnostic == 'access-write-token-kind'
        env:
          CLOUDFLARE_ACCESS_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_WRITE_TOKEN }}
        run: python3 scripts/owner-panel-access-write-token-kind.py
