name: Owner Action Panel GET SELECT-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: owner-panel-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production-readonly-reconcile
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Focused offline safety tests
        run: python3 scripts/owner-panel-readonly-preflight.test.py
      - name: Fixed-target GET and SELECT inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_WORKERS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
          CONTROL_ACCESS_CLIENT_SECRET: ${{ secrets.CONTROL_ACCESS_CLIENT_SECRET }}
        run: python3 scripts/owner-panel-readonly-preflight.py
