name: Phase 5 RPi5 observation Worker post-activation GET-only verify

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main SHA to verify
        required: true
        type: string
      expected_ci_run:
        description: Exact successful push CI run on approved_sha
        required: true
        type: string
      expected_deployment:
        description: Exact active Worker deployment expected after activation
        required: true
        type: string
      expected_version:
        description: Exact active Worker version expected after activation
        required: true
        type: string
      expected_non_target_bindings_sha256:
        description: SHA-256 of the reviewed non-ingest Worker binding inventory
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase5-rpi5-observation-worker-post-activation-verify
  cancel-in-progress: false

jobs:
  verify:
    name: verify exact active Worker state without mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production-readonly-reconcile
    env:
      APPROVED_SHA: ${{ inputs.approved_sha }}
      EXPECTED_CI_RUN: ${{ inputs.expected_ci_run }}
      EXPECTED_DEPLOYMENT: ${{ inputs.expected_deployment }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_NON_TARGET_BINDINGS_SHA256: ${{ inputs.expected_non_target_bindings_sha256 }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Verify canonical Node version
        run: node scripts/verify-node-version.mjs

      - name: Verify post-activation Worker state using GET-only evidence
        env:
          CLOUDFLARE_WORKERS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/phase5-rpi5-observation-worker-post-activation-verify.mjs
