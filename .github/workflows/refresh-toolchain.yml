name: Refresh Phase 0 toolchain

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.repository == 'rozkalnsandris/rozkalns-control-center' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'bootstrap/phase-0-runtime-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: bootstrap/phase-0-runtime-ci

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Resolve current stable Cloudflare and Vite toolchain
        run: |
          npm install --save-dev --save-exact --ignore-scripts \
            @cloudflare/vite-plugin@latest \
            @vitejs/plugin-react@latest \
            vite@latest \
            wrangler@latest

      - name: Record resolved versions
        run: npm ls --depth=0 @cloudflare/vite-plugin @vitejs/plugin-react vite wrangler

      - name: Commit exact package and lock changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Toolchain already current"
            exit 0
          fi
          git commit -m "build: refresh Phase 0 Cloudflare toolchain"
          git push origin HEAD:bootstrap/phase-0-runtime-ci
