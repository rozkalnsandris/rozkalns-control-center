name: Phase 4 Telegram D1 and LIVE scope read-only review

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase4-telegram-d1-live-scope-readonly
  cancel-in-progress: false

jobs:
  evidence:
    name: prove D1 notification state and freeze post-Gate-A scope
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production-readonly-reconcile
    env:
      CONTROL_REPO: rozkalnsandris/rozkalns-control-center
      CF_ACCOUNT_ID: 70e29dbca0e8363358659102d2b74178
      WORKER_NAME: rozkalns-control
      DB_NAME: rozkalns-control-production
      DB_ID: 8504e986-faf0-450c-bfb5-41b5dbf8be09
      DB_JURISDICTION: eu
      DISPATCH_QUEUE_NAME: rozkalns-control-notification-dispatch
      CONTROL_ORIGIN: https://control.rozkalns.net
      EXPECTED_TARGET_KEY: primary
      EXPECTED_RETRY_POLICY_JSON: '{"schemaVersion":1,"maxAttempts":2,"retryDelaysSeconds":[60]}'
      EXPECTED_BATCH_SIZE: '10'
      EXPECTED_BATCH_TIMEOUT_MS: '5000'
      EXPECTED_MAX_RETRIES: '3'
      EXPECTED_RETRY_DELAY: '60'
      EXPECTED_MAX_CONCURRENCY: '1'
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_WORKERS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}

    steps:
      - name: Prove exact-main D1 and paused Queue state without mutation
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          stop() {
            {
              printf 'PHASE4_TELEGRAM_D1_LIVE_SCOPE=STOP\n'
              printf 'STOP=%s\n' "$1"
              printf 'TELEGRAM_PROVIDER_REQUEST=NO\n'
              printf 'QUEUE_MUTATION=NO\n'
              printf 'REMOTE_D1_MUTATION=NO\n'
              printf 'WORKER_MUTATION=NO\n'
              printf 'CLOUDFLARE_CONFIG_MUTATION=NO\n'
              printf 'SECRET_MUTATION=NO\n'
              printf 'CLOUDFLARE_MUTATION=NO\n'
              printf 'LIVE_AUTHORIZATION=NOT_GRANTED\n'
            } >&2
            exit 1
          }

          sanitize_diag() {
            printf '%s' "$1" | LC_ALL=C tr -cd '[:alnum:] _./:@,+{}\[\]"-' | cut -c1-320
          }

          for cmd in curl jq; do
            command -v "$cmd" >/dev/null 2>&1 || stop "MISSING_${cmd^^}"
          done

          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || stop WORKFLOW_EVENT_NOT_DISPATCH
          [ "${GITHUB_REF_NAME:-}" = "main" ] || stop WORKFLOW_REF_NOT_MAIN
          [ -n "${GITHUB_TOKEN:-}" ] || stop MISSING_GITHUB_TOKEN
          [ -n "${CLOUDFLARE_WORKERS_READ_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_WORKERS_READ_TOKEN
          [ -n "${CLOUDFLARE_D1_READ_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_D1_READ_TOKEN

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          gh_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${CONTROL_REPO}${path}" > "$out" || stop GITHUB_GET_FAILED
          }

          cf_workers_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_WORKERS_READ_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_WORKERS_GET_FAILED
            jq -e '.success == true' "$out" >/dev/null || stop CLOUDFLARE_WORKERS_RESPONSE_INVALID
          }

          cf_d1_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_D1_READ_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_D1_GET_FAILED
            jq -e '.success == true' "$out" >/dev/null || stop CLOUDFLARE_D1_RESPONSE_INVALID
          }

          cf_d1_select() {
            local sql="$1" out="$2"
            [[ "$sql" == SELECT\ * ]] || stop D1_QUERY_NOT_SELECT
            [[ "$sql" != *';'* ]] || stop D1_QUERY_MULTISTATEMENT_FORBIDDEN
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_D1_READ_TOKEN}" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg sql "$sql" '{sql:$sql}')" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database/${DB_ID}/query" > "$out" || stop CLOUDFLARE_D1_SELECT_FAILED
            jq -e '
              .success == true and
              (.result | type == "array") and
              (.result | length == 1) and
              .result[0].success == true and
              (.result[0].results | type == "array") and
              ((.result[0].meta.changed_db // false) == false) and
              (((.result[0].meta.rows_written // 0) | tonumber) == 0) and
              (((.result[0].meta.changes // 0) | tonumber) == 0)
            ' "$out" >/dev/null || stop D1_SELECT_REPORTED_MUTATION_OR_FAILURE
          }

          printf '%s\n' STAGE=GITHUB_EXACT_MAIN_CI
          run_sha="${GITHUB_SHA:-}"
          [[ "$run_sha" =~ ^[0-9a-f]{40}$ ]] || stop WORKFLOW_SHA_INVALID
          gh_get '/branches/main' "$tmp/main-before.json"
          jq -e --arg sha "$run_sha" '.commit.sha == $sha' "$tmp/main-before.json" >/dev/null || stop MAIN_SHA_DRIFT
          gh_get "/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${run_sha}&per_page=10" "$tmp/ci-runs.json"
          ci_run_id="$(
            jq -r --arg sha "$run_sha" '
              [.workflow_runs[]? | select(
                .name == "CI" and
                .path == ".github/workflows/ci.yml" and
                .head_branch == "main" and
                .head_sha == $sha and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success"
              )] | sort_by(.run_number) | last | .id // empty
            ' "$tmp/ci-runs.json"
          )"
          [[ "$ci_run_id" =~ ^[0-9]+$ ]] || stop EXACT_MAIN_CI_NOT_SUCCESS
          gh_get "/actions/runs/${ci_run_id}" "$tmp/ci.json"
          jq -e --arg sha "$run_sha" --argjson id "$ci_run_id" '
            .id == $id and .name == "CI" and .path == ".github/workflows/ci.yml" and
            .head_branch == "main" and .head_sha == $sha and .event == "push" and
            .status == "completed" and .conclusion == "success"
          ' "$tmp/ci.json" >/dev/null || stop EXACT_MAIN_CI_DRIFT
          printf 'SOURCE_SHA=%s\n' "$run_sha"
          printf 'CI_RUN_ID=%s\n' "$ci_run_id"

          printf '%s\n' STAGE=PRODUCTION_WORKER_BASELINE
          cf_workers_get "/workers/scripts/${WORKER_NAME}/deployments" "$tmp/deployments.json"
          jq -e '
            (.result.deployments | type == "array") and
            (.result.deployments | length >= 1) and
            (.result.deployments[0].id | type == "string") and
            (.result.deployments[0].versions | type == "array") and
            (.result.deployments[0].versions | length == 1) and
            (.result.deployments[0].versions[0].version_id | type == "string") and
            .result.deployments[0].versions[0].percentage == 100
          ' "$tmp/deployments.json" >/dev/null || stop ACTIVE_DEPLOYMENT_NOT_SINGLE_VERSION_100_PERCENT
          current_deployment="$(jq -r '.result.deployments[0].id' "$tmp/deployments.json")"
          current_version="$(jq -r '.result.deployments[0].versions[0].version_id' "$tmp/deployments.json")"
          printf 'CURRENT_DEPLOYMENT=%s\n' "$(sanitize_diag "$current_deployment")"
          printf 'CURRENT_VERSION=%s\n' "$(sanitize_diag "$current_version")"
          printf 'ACTIVE_TRAFFIC_PERCENT=100\n'

          cf_workers_get "/workers/scripts/${WORKER_NAME}/versions/${current_version}" "$tmp/version.json"
          jq -e \
            --arg version "$current_version" \
            --arg target "$EXPECTED_TARGET_KEY" \
            --arg retry "$EXPECTED_RETRY_POLICY_JSON" \
            --arg origin "$CONTROL_ORIGIN" \
            --arg queue "$DISPATCH_QUEUE_NAME" '
              .result.id == $version and
              (.result.resources.bindings // [] | type == "array") and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_TRANSITIONS_ENABLED")] | length == 1) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_TRANSITIONS_ENABLED")][0] | .type == "plain_text" and .text == "true") and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_DISPATCH_ENABLED")] | length == 1) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_DISPATCH_ENABLED")][0] | .type == "plain_text" and .text == "true") and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_TARGET_KEYS")] | length == 1) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_TARGET_KEY")] | length == 1) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_TARGET_KEYS")][0] | .type == "plain_text" and ((.text | fromjson) == [$target])) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_TARGET_KEY")][0] | .type == "plain_text" and .text == $target) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_RETRY_POLICY")] | length == 1) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_RETRY_POLICY")][0] | .type == "plain_text" and ((.text | fromjson) == ($retry | fromjson))) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_BOT_TOKEN")] | length == 1) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_BOT_TOKEN")][0] | (.type == "secret_text" or .type == "secret_key")) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_CHAT_ID")] | length == 1) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_CHAT_ID")][0] | (.type == "secret_text" or .type == "secret_key")) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_CONTROL_ORIGIN")] | length == 1) and
              ([.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_CONTROL_ORIGIN")][0] | .type == "plain_text" and .text == $origin) and
              ([.result.resources.bindings[]? | select(.name == "NOTIFICATION_DISPATCH_QUEUE")] | length == 1) and
              ([.result.resources.bindings[]? | select(.name == "NOTIFICATION_DISPATCH_QUEUE")][0] | .type == "queue" and ((.queue_name // "") == $queue))
            ' "$tmp/version.json" >/dev/null || stop NOTIFICATION_BINDINGS_INVALID
          printf 'NOTIFICATION_BINDINGS=VALID\n'

          printf '%s\n' STAGE=D1_NOTIFICATION_MIGRATION_EVIDENCE
          cf_d1_get "/d1/database/${DB_ID}" "$tmp/db.json"
          jq -e --arg id "$DB_ID" --arg name "$DB_NAME" --arg jurisdiction "$DB_JURISDICTION" '
            .result.uuid == $id and .result.name == $name and .result.jurisdiction == $jurisdiction
          ' "$tmp/db.json" >/dev/null || stop D1_RESOURCE_IDENTITY_INVALID
          printf 'D1_RESOURCE_IDENTITY=VALID\n'

          migration_sql="SELECT id, name FROM d1_migrations WHERE name IN ('0003_notification_transitions.sql','0004_notification_delivery_intents.sql','0005_notification_delivery_attempts.sql','0006_notification_delivery_dispatch_claims.sql') ORDER BY id"
          cf_d1_select "$migration_sql" "$tmp/migrations.json"
          jq -e '
            [.result[0].results[]?.name] == [
              "0003_notification_transitions.sql",
              "0004_notification_delivery_intents.sql",
              "0005_notification_delivery_attempts.sql",
              "0006_notification_delivery_dispatch_claims.sql"
            ] and
            ([.result[0].results[]?.id] | length == 4) and
            ([.result[0].results[]?.id] | all(type == "number" and floor == .))
          ' "$tmp/migrations.json" >/dev/null || stop D1_NOTIFICATION_MIGRATION_HISTORY_INVALID
          printf 'D1_NOTIFICATION_MIGRATIONS=PROVEN_0003_THROUGH_0006\n'

          schema_sql="SELECT type, name, tbl_name FROM sqlite_schema WHERE name IN ('notification_transitions','notification_delivery_intents','notification_delivery_attempts','notification_delivery_dispatch_claims') ORDER BY name"
          cf_d1_select "$schema_sql" "$tmp/schema.json"
          jq -e '
            [.result[0].results[]? | {type,name,tbl_name}] == [
              {type:"table",name:"notification_delivery_attempts",tbl_name:"notification_delivery_attempts"},
              {type:"table",name:"notification_delivery_dispatch_claims",tbl_name:"notification_delivery_dispatch_claims"},
              {type:"table",name:"notification_delivery_intents",tbl_name:"notification_delivery_intents"},
              {type:"table",name:"notification_transitions",tbl_name:"notification_transitions"}
            ]
          ' "$tmp/schema.json" >/dev/null || stop D1_NOTIFICATION_SCHEMA_INVALID
          printf 'D1_NOTIFICATION_TABLES=PRESENT\n'

          counts_sql="SELECT (SELECT COUNT(*) FROM notification_transitions) AS notification_transitions, (SELECT COUNT(*) FROM notification_delivery_intents) AS notification_delivery_intents, (SELECT COUNT(*) FROM notification_delivery_attempts) AS notification_delivery_attempts, (SELECT COUNT(*) FROM notification_delivery_dispatch_claims) AS notification_delivery_dispatch_claims"
          cf_d1_select "$counts_sql" "$tmp/counts.json"
          jq -e '.result[0].results | length == 1' "$tmp/counts.json" >/dev/null || stop D1_NOTIFICATION_ROW_COUNTS_INVALID
          transition_rows="$(jq -r '.result[0].results[0].notification_transitions // empty' "$tmp/counts.json")"
          intent_rows="$(jq -r '.result[0].results[0].notification_delivery_intents // empty' "$tmp/counts.json")"
          attempt_rows="$(jq -r '.result[0].results[0].notification_delivery_attempts // empty' "$tmp/counts.json")"
          claim_rows="$(jq -r '.result[0].results[0].notification_delivery_dispatch_claims // empty' "$tmp/counts.json")"
          for value in "$transition_rows" "$intent_rows" "$attempt_rows" "$claim_rows"; do
            [[ "$value" =~ ^[0-9]+$ ]] || stop D1_NOTIFICATION_ROW_COUNTS_INVALID
          done
          printf 'D1_NOTIFICATION_TRANSITION_ROWS=%s\n' "$transition_rows"
          printf 'D1_NOTIFICATION_INTENT_ROWS=%s\n' "$intent_rows"
          printf 'D1_NOTIFICATION_ATTEMPT_ROWS=%s\n' "$attempt_rows"
          printf 'D1_NOTIFICATION_DISPATCH_CLAIM_ROWS=%s\n' "$claim_rows"
          printf 'D1_NOTIFICATION_ROW_COUNTS=EVIDENCE_ONLY\n'

          printf '%s\n' STAGE=PAUSED_QUEUE_AND_BACKLOG_EVIDENCE
          cf_workers_get '/queues?per_page=100&page=1' "$tmp/queues.json"
          jq -e '.result | type == "array"' "$tmp/queues.json" >/dev/null || stop QUEUE_INVENTORY_INVALID
          [ "$(jq -r '.result_info.total_pages // 1' "$tmp/queues.json")" = "1" ] || stop QUEUE_INVENTORY_PAGINATION_AMBIGUOUS
          queue_match_count="$(jq -r --arg name "$DISPATCH_QUEUE_NAME" '[.result[]? | select(.queue_name == $name)] | length' "$tmp/queues.json")"
          [ "$queue_match_count" = "1" ] || stop DISPATCH_QUEUE_NOT_UNIQUE
          queue_id="$(jq -r --arg name "$DISPATCH_QUEUE_NAME" '[.result[]? | select(.queue_name == $name)][0].queue_id // empty' "$tmp/queues.json")"
          [ -n "$queue_id" ] || stop DISPATCH_QUEUE_ID_MISSING

          cf_workers_get "/queues/${queue_id}" "$tmp/queue.json"
          jq -e --arg id "$queue_id" --arg name "$DISPATCH_QUEUE_NAME" '
            .result.queue_id == $id and .result.queue_name == $name and
            (.result.settings | type == "object") and .result.settings.delivery_paused == true
          ' "$tmp/queue.json" >/dev/null || stop DISPATCH_QUEUE_NOT_PAUSED
          printf 'DISPATCH_QUEUE_ID=%s\n' "$(sanitize_diag "$queue_id")"
          printf 'DISPATCH_QUEUE_DELIVERY=PAUSED\n'

          cf_workers_get "/queues/${queue_id}/consumers" "$tmp/consumers.json"
          jq -e \
            --arg worker "$WORKER_NAME" \
            --arg queue "$DISPATCH_QUEUE_NAME" \
            --argjson batch "$EXPECTED_BATCH_SIZE" \
            --argjson wait "$EXPECTED_BATCH_TIMEOUT_MS" \
            --argjson retries "$EXPECTED_MAX_RETRIES" \
            --argjson delay "$EXPECTED_RETRY_DELAY" \
            --argjson concurrency "$EXPECTED_MAX_CONCURRENCY" '
              (.result | type == "array") and (.result | length == 1) and
              .result[0].type == "worker" and .result[0].queue_name == $queue and
              ((.result[0].script_name == null) or (.result[0].script_name == $worker)) and
              .result[0].settings.batch_size == $batch and
              .result[0].settings.max_wait_time_ms == $wait and
              .result[0].settings.max_retries == $retries and
              .result[0].settings.retry_delay == $delay and
              .result[0].settings.max_concurrency == $concurrency and
              ((.result[0].dead_letter_queue // "") == "")
            ' "$tmp/consumers.json" >/dev/null || stop DISPATCH_QUEUE_CONSUMER_INVALID
          consumer_id="$(jq -r '.result[0].consumer_id // empty' "$tmp/consumers.json")"
          [ -n "$consumer_id" ] || stop DISPATCH_QUEUE_CONSUMER_ID_MISSING
          printf 'DISPATCH_QUEUE_CONSUMER_ID=%s\n' "$(sanitize_diag "$consumer_id")"
          printf 'DISPATCH_QUEUE_CONSUMER=VALID\n'

          cf_workers_get "/queues/${queue_id}/metrics" "$tmp/metrics.json"
          jq -e '
            (.result.backlog_count | type == "number" and . >= 0) and
            (.result.backlog_bytes | type == "number" and . >= 0) and
            (.result.oldest_message_timestamp_ms | type == "number" and . >= 0)
          ' "$tmp/metrics.json" >/dev/null || stop DISPATCH_QUEUE_METRICS_INVALID
          backlog_count="$(jq -r '.result.backlog_count' "$tmp/metrics.json")"
          backlog_bytes="$(jq -r '.result.backlog_bytes' "$tmp/metrics.json")"
          oldest_message_ms="$(jq -r '.result.oldest_message_timestamp_ms' "$tmp/metrics.json")"
          printf 'DISPATCH_QUEUE_BACKLOG_COUNT=%s\n' "$backlog_count"
          printf 'DISPATCH_QUEUE_BACKLOG_BYTES=%s\n' "$backlog_bytes"
          printf 'DISPATCH_QUEUE_OLDEST_MESSAGE_TIMESTAMP_MS=%s\n' "$oldest_message_ms"
          printf 'DISPATCH_QUEUE_METRICS=BEST_EFFORT_POINT_IN_TIME\n'
          if [ "$backlog_count" -eq 0 ]; then
            gate_b_eligibility=SOURCE_EXECUTOR_REQUIRED
          else
            gate_b_eligibility=BACKLOG_POLICY_REVIEW_REQUIRED
          fi
          printf 'GATE_B_ELIGIBILITY=%s\n' "$gate_b_eligibility"

          printf '%s\n' STAGE=FINAL_ANTI_DRIFT
          gh_get '/branches/main' "$tmp/main-after.json"
          jq -e --arg sha "$run_sha" '.commit.sha == $sha' "$tmp/main-after.json" >/dev/null || stop FINAL_MAIN_SHA_DRIFT
          cf_workers_get "/workers/scripts/${WORKER_NAME}/deployments" "$tmp/deployments-after.json"
          jq -e --arg deployment "$current_deployment" --arg version "$current_version" '
            .result.deployments[0].id == $deployment and
            (.result.deployments[0].versions | length == 1) and
            .result.deployments[0].versions[0].version_id == $version and
            .result.deployments[0].versions[0].percentage == 100
          ' "$tmp/deployments-after.json" >/dev/null || stop FINAL_PRODUCTION_BASELINE_DRIFT
          cf_workers_get "/queues/${queue_id}" "$tmp/queue-after.json"
          jq -e --arg id "$queue_id" --arg name "$DISPATCH_QUEUE_NAME" '
            .result.queue_id == $id and .result.queue_name == $name and
            .result.settings.delivery_paused == true
          ' "$tmp/queue-after.json" >/dev/null || stop FINAL_QUEUE_PAUSE_DRIFT

          printf 'PHASE4_TELEGRAM_D1_LIVE_SCOPE=READY_FOR_SOURCE_GATE_B_REVIEW\n'
          printf 'D1_NOTIFICATION_MIGRATIONS=PROVEN_0003_THROUGH_0006\n'
          printf 'GET_OR_SELECT_ONLY_PREREQUISITES=PASS\n'
          printf 'GATE_A_REPLAY=FORBIDDEN\n'
          printf 'D1_MUTATION_MAX=0\n'
          printf 'QUEUE_CREATE_MUTATION_MAX=0\n'
          printf 'QUEUE_PAUSE_MUTATION_MAX=0\n'
          printf 'QUEUE_CONSUMER_MUTATION_MAX=0\n'
          printf 'SECRET_BINDING_MUTATION_MAX=0\n'
          printf 'WORKER_VERSION_UPLOAD_MAX=0\n'
          printf 'WORKER_DEPLOYMENT_WRITE_MAX=0\n'
          printf 'PROVIDER_DELIVERY_RESUME_MUTATION_MAX=1\n'
          printf 'DIRECT_TELEGRAM_API_REQUEST_MAX=0\n'
          printf 'PROVIDER_RESUME_PRECONDITION=FRESH_QUEUE_PAUSED_AND_BACKLOG_RECHECK_REQUIRED\n'
          printf 'GATE_B_EXECUTOR=NOT_PRESENT_REVIEW_REQUIRED\n'
          printf 'TELEGRAM_PROVIDER_REQUEST=NO\n'
          printf 'QUEUE_MUTATION=NO\n'
          printf 'REMOTE_D1_MUTATION=NO\n'
          printf 'WORKER_MUTATION=NO\n'
          printf 'CLOUDFLARE_CONFIG_MUTATION=NO\n'
          printf 'SECRET_MUTATION=NO\n'
          printf 'CLOUDFLARE_MUTATION=NO\n'
          printf 'LIVE_AUTHORIZATION=NOT_GRANTED\n'
          printf 'NEXT_GATE=SOURCE_GATE_B_EXECUTOR_AND_SEPARATE_LIVE_AUTHORIZATION\n'