name: Phase 4 Telegram activation GET-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase4-telegram-activation-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: inspect Telegram activation prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production-readonly-reconcile
    env:
      CONTROL_REPO: rozkalnsandris/rozkalns-control-center
      CF_ACCOUNT_ID: 70e29dbca0e8363358659102d2b74178
      WORKER_NAME: rozkalns-control
      DISPATCH_QUEUE_NAME: rozkalns-control-notification-dispatch
      CONTROL_ORIGIN: https://control.rozkalns.net
      EXPECTED_TARGET_KEY: primary
      EXPECTED_RETRY_POLICY_JSON: '{"schemaVersion":1,"maxAttempts":2,"retryDelaysSeconds":[60]}'
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Inspect exact-main production activation prerequisites with GET only
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          stop() {
            {
              printf 'TELEGRAM_ACTIVATION_PREFLIGHT=STOP\n'
              printf 'STOP=%s\n' "$1"
              printf 'D1_NOTIFICATION_MIGRATIONS=NOT_PROVEN_GET_ONLY\n'
              printf 'TELEGRAM_PROVIDER_REQUEST=NO\n'
              printf 'QUEUE_MUTATION=NO\n'
              printf 'REMOTE_D1_MUTATION=NO\n'
              printf 'WORKER_MUTATION=NO\n'
              printf 'CLOUDFLARE_CONFIG_MUTATION=NO\n'
              printf 'SECRET_MUTATION=NO\n'
              printf 'CLOUDFLARE_MUTATION=NO\n'
              printf 'LIVE_AUTHORIZATION=NOT_GRANTED\n'
            } >&2
            exit 1
          }

          sanitize_diag() {
            printf '%s' "$1" | LC_ALL=C tr -cd '[:alnum:] _./:@,+{}\[\]"-' | cut -c1-320
          }

          for cmd in curl jq; do
            command -v "$cmd" >/dev/null 2>&1 || stop "MISSING_${cmd^^}"
          done

          [ -n "${GITHUB_TOKEN:-}" ] || stop MISSING_GITHUB_TOKEN
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || stop MISSING_CLOUDFLARE_API_TOKEN

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          gh_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${CONTROL_REPO}${path}" > "$out" || stop GITHUB_GET_FAILED
          }

          cf_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}${path}" > "$out" || stop CLOUDFLARE_GET_FAILED
            jq -e '.success == true' "$out" >/dev/null || stop CLOUDFLARE_RESPONSE_INVALID
          }

          printf '%s\n' STAGE=GITHUB_EXACT_MAIN_CI
          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || stop WORKFLOW_EVENT_NOT_DISPATCH
          [ "${GITHUB_REF_NAME:-}" = "main" ] || stop WORKFLOW_REF_NOT_MAIN
          run_sha="${GITHUB_SHA:-}"
          [ -n "$run_sha" ] || stop WORKFLOW_SHA_MISSING

          gh_get '/branches/main' "$tmp/main-before.json"
          jq -e --arg sha "$run_sha" '.commit.sha == $sha' "$tmp/main-before.json" >/dev/null || stop MAIN_SHA_DRIFT

          gh_get "/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${run_sha}&per_page=10" "$tmp/ci-runs.json"
          ci_run_id="$(
            jq -r --arg sha "$run_sha" '
              [
                .workflow_runs[]?
                | select(
                    .name == "CI" and
                    .path == ".github/workflows/ci.yml" and
                    .head_branch == "main" and
                    .head_sha == $sha and
                    .event == "push" and
                    .status == "completed" and
                    .conclusion == "success"
                  )
              ]
              | sort_by(.run_number)
              | last
              | .id // empty
            ' "$tmp/ci-runs.json"
          )"
          [ -n "$ci_run_id" ] || stop EXACT_MAIN_CI_NOT_SUCCESS

          gh_get "/actions/runs/${ci_run_id}" "$tmp/ci.json"
          jq -e --arg sha "$run_sha" --argjson id "$ci_run_id" '
            .id == $id and
            .name == "CI" and
            .path == ".github/workflows/ci.yml" and
            .head_branch == "main" and
            .head_sha == $sha and
            .event == "push" and
            .status == "completed" and
            .conclusion == "success"
          ' "$tmp/ci.json" >/dev/null || stop EXACT_MAIN_CI_DRIFT

          printf '%s\n' STAGE=CLOUDFLARE_ACTIVE_DEPLOYMENT
          cf_get "/workers/scripts/${WORKER_NAME}/deployments" "$tmp/deployments.json"
          jq -e '
            (.result.deployments | type == "array") and
            (.result.deployments | length >= 1) and
            (.result.deployments[0].id | type == "string") and
            (.result.deployments[0].versions | type == "array") and
            (.result.deployments[0].versions | length == 1) and
            (.result.deployments[0].versions[0].version_id | type == "string") and
            (.result.deployments[0].versions[0].percentage == 100)
          ' "$tmp/deployments.json" >/dev/null || stop ACTIVE_DEPLOYMENT_NOT_SINGLE_VERSION_100_PERCENT

          current_deployment="$(jq -r '.result.deployments[0].id' "$tmp/deployments.json")"
          current_version="$(jq -r '.result.deployments[0].versions[0].version_id' "$tmp/deployments.json")"
          printf 'CURRENT_DEPLOYMENT=%s\n' "$(sanitize_diag "$current_deployment")"
          printf 'CURRENT_VERSION=%s\n' "$(sanitize_diag "$current_version")"
          printf 'ACTIVE_TRAFFIC_PERCENT=100\n'

          printf '%s\n' STAGE=WORKER_NOTIFICATION_BINDING_INVENTORY
          cf_get "/workers/scripts/${WORKER_NAME}/versions/${current_version}" "$tmp/version.json"
          jq -e --arg ver "$current_version" '.result.id == $ver and (.result.resources.bindings // [] | type == "array")' "$tmp/version.json" >/dev/null || stop VERSION_BINDING_INVENTORY_INVALID

          activation_failures=0
          retry_max_attempts=0

          transition_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_TRANSITIONS_ENABLED")] | length' "$tmp/version.json")"
          if [ "$transition_count" = "0" ]; then
            printf 'TRANSITION_OPT_IN=MISSING\n'
            activation_failures=$((activation_failures + 1))
          elif [ "$transition_count" = "1" ] && jq -e '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_TRANSITIONS_ENABLED")][0] | .type == "plain_text" and .text == "true"' "$tmp/version.json" >/dev/null; then
            printf 'TRANSITION_OPT_IN=ENABLED\n'
          else
            printf 'TRANSITION_OPT_IN=INVALID\n'
            activation_failures=$((activation_failures + 1))
          fi

          dispatch_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_DISPATCH_ENABLED")] | length' "$tmp/version.json")"
          if [ "$dispatch_count" = "0" ]; then
            printf 'DISPATCH_OPT_IN=MISSING\n'
            activation_failures=$((activation_failures + 1))
          elif [ "$dispatch_count" = "1" ] && jq -e '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_DISPATCH_ENABLED")][0] | .type == "plain_text" and .text == "true"' "$tmp/version.json" >/dev/null; then
            printf 'DISPATCH_OPT_IN=ENABLED\n'
          else
            printf 'DISPATCH_OPT_IN=INVALID\n'
            activation_failures=$((activation_failures + 1))
          fi

          targets_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_TARGET_KEYS")] | length' "$tmp/version.json")"
          telegram_target_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_TARGET_KEY")] | length' "$tmp/version.json")"
          if [ "$targets_count" = "0" ] || [ "$telegram_target_count" = "0" ]; then
            printf 'TARGET_CONTRACT=MISSING\n'
            activation_failures=$((activation_failures + 1))
          elif [ "$targets_count" = "1" ] && [ "$telegram_target_count" = "1" ] && jq -e --arg target "$EXPECTED_TARGET_KEY" '
            [.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_TARGET_KEYS")][0] as $targetsBinding |
            [.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_TARGET_KEY")][0] as $targetBinding |
            ($targetsBinding.type == "plain_text") and
            ($targetBinding.type == "plain_text") and
            ($targetsBinding.text | fromjson) as $targets |
            ($targets | type == "array" and length == 1) and
            ($targets[0] | type == "string" and test("^[a-z0-9](?:[a-z0-9._:-]{0,63})$")) and
            ($targets == [$target]) and
            ($targetBinding.text == $target)
          ' "$tmp/version.json" >/dev/null 2>&1; then
            printf 'TARGET_CONTRACT=VALID_SINGLE_TELEGRAM_TARGET\n'
            printf 'TARGET_KEY=%s\n' "$EXPECTED_TARGET_KEY"
          else
            printf 'TARGET_CONTRACT=INVALID\n'
            activation_failures=$((activation_failures + 1))
          fi

          retry_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_RETRY_POLICY")] | length' "$tmp/version.json")"
          if [ "$retry_count" = "0" ]; then
            printf 'RETRY_POLICY=MISSING\n'
            activation_failures=$((activation_failures + 1))
          elif [ "$retry_count" = "1" ] && jq -e --arg expected "$EXPECTED_RETRY_POLICY_JSON" '
            [.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_RETRY_POLICY")][0] as $binding |
            ($binding.type == "plain_text") and
            ($binding.text | fromjson) as $retry |
            ($expected | fromjson) as $expectedRetry |
            ($retry == $expectedRetry) and
            ($retry | type == "object") and
            ($retry.schemaVersion == 1) and
            ($retry.maxAttempts | type == "number" and floor == . and . >= 1 and . <= 8) and
            ($retry.retryDelaysSeconds | type == "array" and length == ($retry.maxAttempts - 1)) and
            (all($retry.retryDelaysSeconds[]?; type == "number" and floor == . and . >= 1 and . <= 86400))
          ' "$tmp/version.json" >/dev/null 2>&1; then
            retry_max_attempts="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_RETRY_POLICY")][0].text | fromjson | .maxAttempts' "$tmp/version.json")"
            printf 'RETRY_POLICY=VALID\n'
            printf 'RETRY_MAX_ATTEMPTS=%s\n' "$retry_max_attempts"
          else
            printf 'RETRY_POLICY=INVALID\n'
            activation_failures=$((activation_failures + 1))
          fi

          bot_token_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_BOT_TOKEN")] | length' "$tmp/version.json")"
          if [ "$bot_token_count" = "0" ]; then
            printf 'TELEGRAM_BOT_TOKEN_BINDING=MISSING\n'
            activation_failures=$((activation_failures + 1))
          elif [ "$bot_token_count" = "1" ] && jq -e '[.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_BOT_TOKEN")][0] | .type == "secret_text" or .type == "secret_key"' "$tmp/version.json" >/dev/null; then
            printf 'TELEGRAM_BOT_TOKEN_BINDING=PRESENT_SECRET\n'
          else
            printf 'TELEGRAM_BOT_TOKEN_BINDING=INVALID\n'
            activation_failures=$((activation_failures + 1))
          fi

          chat_id_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_CHAT_ID")] | length' "$tmp/version.json")"
          if [ "$chat_id_count" = "0" ]; then
            printf 'TELEGRAM_CHAT_ID_BINDING=MISSING\n'
            activation_failures=$((activation_failures + 1))
          elif [ "$chat_id_count" = "1" ] && jq -e '[.result.resources.bindings[]? | select(.name == "CONTROL_TELEGRAM_CHAT_ID")][0] | .type == "secret_text" or .type == "secret_key"' "$tmp/version.json" >/dev/null; then
            printf 'TELEGRAM_CHAT_ID_BINDING=PRESENT_SECRET\n'
          else
            printf 'TELEGRAM_CHAT_ID_BINDING=INVALID\n'
            activation_failures=$((activation_failures + 1))
          fi

          origin_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_CONTROL_ORIGIN")] | length' "$tmp/version.json")"
          if [ "$origin_count" = "0" ]; then
            printf 'CONTROL_ORIGIN=MISSING\n'
            activation_failures=$((activation_failures + 1))
          elif [ "$origin_count" = "1" ] && jq -e --arg origin "$CONTROL_ORIGIN" '[.result.resources.bindings[]? | select(.name == "CONTROL_NOTIFICATION_CONTROL_ORIGIN")][0] | .type == "plain_text" and .text == $origin' "$tmp/version.json" >/dev/null; then
            printf 'CONTROL_ORIGIN=VALID\n'
          else
            printf 'CONTROL_ORIGIN=INVALID\n'
            activation_failures=$((activation_failures + 1))
          fi

          queue_binding_count="$(jq -r '[.result.resources.bindings[]? | select(.name == "NOTIFICATION_DISPATCH_QUEUE")] | length' "$tmp/version.json")"
          if [ "$queue_binding_count" = "0" ]; then
            printf 'DISPATCH_QUEUE_PRODUCER_BINDING=MISSING\n'
            activation_failures=$((activation_failures + 1))
          elif [ "$queue_binding_count" = "1" ] && jq -e --arg queue "$DISPATCH_QUEUE_NAME" '[.result.resources.bindings[]? | select(.name == "NOTIFICATION_DISPATCH_QUEUE")][0] | .type == "queue" and ((.queue_name // "") == $queue)' "$tmp/version.json" >/dev/null; then
            printf 'DISPATCH_QUEUE_PRODUCER_BINDING=PRESENT\n'
          else
            printf 'DISPATCH_QUEUE_PRODUCER_BINDING=INVALID\n'
            activation_failures=$((activation_failures + 1))
          fi

          printf 'NOTIFICATION_ACTIVATION_BINDING_FAILURES=%s\n' "$activation_failures"
          [ "$activation_failures" -eq 0 ] || stop NOTIFICATION_ACTIVATION_BINDINGS_INCOMPLETE
          [ "$retry_max_attempts" -ge 1 ] 2>/dev/null || stop RETRY_POLICY_INVALID

          printf '%s\n' STAGE=QUEUE_TOPOLOGY_INVENTORY
          cf_get '/queues?per_page=100&page=1' "$tmp/queues.json"
          jq -e '.result | type == "array"' "$tmp/queues.json" >/dev/null || stop QUEUE_INVENTORY_INVALID
          total_pages="$(jq -r '.result_info.total_pages // 1' "$tmp/queues.json")"
          [ "$total_pages" = "1" ] || stop QUEUE_INVENTORY_PAGINATION_AMBIGUOUS

          queue_match_count="$(jq -r --arg name "$DISPATCH_QUEUE_NAME" '[.result[]? | select(.queue_name == $name)] | length' "$tmp/queues.json")"
          [ "$queue_match_count" = "1" ] || stop DISPATCH_QUEUE_NOT_UNIQUE
          queue_id="$(jq -r --arg name "$DISPATCH_QUEUE_NAME" '[.result[]? | select(.queue_name == $name)][0].queue_id // empty' "$tmp/queues.json")"
          [ -n "$queue_id" ] || stop DISPATCH_QUEUE_ID_MISSING
          printf 'DISPATCH_QUEUE=PRESENT\n'
          printf 'DISPATCH_QUEUE_ID=%s\n' "$(sanitize_diag "$queue_id")"

          cf_get "/queues/${queue_id}/consumers" "$tmp/consumers.json"
          jq -e '.result | type == "array"' "$tmp/consumers.json" >/dev/null || stop DISPATCH_QUEUE_CONSUMERS_INVALID
          consumer_match_count="$(jq -r --arg worker "$WORKER_NAME" --arg queue "$DISPATCH_QUEUE_NAME" '[.result[]? | select(.script_name == $worker and .queue_name == $queue)] | length' "$tmp/consumers.json")"
          [ "$consumer_match_count" = "1" ] || stop DISPATCH_QUEUE_WORKER_CONSUMER_NOT_UNIQUE

          jq -e --arg worker "$WORKER_NAME" --arg queue "$DISPATCH_QUEUE_NAME" --argjson attempts "$retry_max_attempts" '
            [.result[]? | select(.script_name == $worker and .queue_name == $queue)][0] as $c |
            ($c.consumer_id | type == "string" and length > 0) and
            ($c.settings | type == "object") and
            ($c.settings.batch_size | type == "number" and floor == . and . >= 1) and
            ($c.settings.max_retries | type == "number" and floor == . and . >= ($attempts - 1))
          ' "$tmp/consumers.json" >/dev/null || stop DISPATCH_QUEUE_CONSUMER_POLICY_INCOMPATIBLE

          consumer_id="$(jq -r --arg worker "$WORKER_NAME" --arg queue "$DISPATCH_QUEUE_NAME" '[.result[]? | select(.script_name == $worker and .queue_name == $queue)][0].consumer_id' "$tmp/consumers.json")"
          consumer_settings="$(jq -c --arg worker "$WORKER_NAME" --arg queue "$DISPATCH_QUEUE_NAME" '[.result[]? | select(.script_name == $worker and .queue_name == $queue)][0].settings | {batch_size,max_concurrency,max_retries,retry_delay,max_wait_time_ms}' "$tmp/consumers.json")"
          printf 'DISPATCH_QUEUE_CONSUMER=PRESENT\n'
          printf 'DISPATCH_QUEUE_CONSUMER_ID=%s\n' "$(sanitize_diag "$consumer_id")"
          printf 'DISPATCH_QUEUE_CONSUMER_SETTINGS=%s\n' "$(sanitize_diag "$consumer_settings")"

          printf '%s\n' STAGE=FINAL_ANTI_DRIFT
          gh_get '/branches/main' "$tmp/main-after.json"
          jq -e --arg sha "$run_sha" '.commit.sha == $sha' "$tmp/main-after.json" >/dev/null || stop FINAL_MAIN_SHA_DRIFT

          printf 'TELEGRAM_ACTIVATION_PREFLIGHT=READY_FOR_LIVE_SCOPE_REVIEW\n'
          printf 'SOURCE_SHA=%s\n' "$run_sha"
          printf 'CI_RUN_ID=%s\n' "$ci_run_id"
          printf 'WORKER_SOURCE_SHA=NOT_PROVEN_BY_CLOUDFLARE_GET\n'
          printf 'D1_NOTIFICATION_MIGRATIONS=NOT_PROVEN_GET_ONLY\n'
          printf 'GET_ONLY_PREREQUISITES=PASS\n'
          printf 'TELEGRAM_PROVIDER_REQUEST=NO\n'
          printf 'QUEUE_MUTATION=NO\n'
          printf 'REMOTE_D1_MUTATION=NO\n'
          printf 'WORKER_MUTATION=NO\n'
          printf 'CLOUDFLARE_CONFIG_MUTATION=NO\n'
          printf 'SECRET_MUTATION=NO\n'
          printf 'CLOUDFLARE_MUTATION=NO\n'
          printf 'LIVE_AUTHORIZATION=NOT_GRANTED\n'
          printf 'NEXT_GATE=D1_MIGRATION_EVIDENCE_AND_EXACT_LIVE_SCOPE_REVIEW\n'
