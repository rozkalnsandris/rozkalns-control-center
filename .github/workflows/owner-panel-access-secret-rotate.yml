name: Owner Action Panel Access service-token secret rotation one-shot

on:
  workflow_dispatch:
    inputs:
      owner_authorization:
        description: Exact owner authorization bound to main, CI, health403 credential-effect evidence, and one rotation
        required: true
        type: string
      recipient_public_key_b64:
        description: Base64-encoded RSA public key for sealed credential handoff
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: owner-panel-access-secret-rotate-one-shot
  cancel-in-progress: false

jobs:
  rotate:
    name: rotate selected Access service-token secret exactly once
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment:
      name: production-readonly-reconcile
      deployment: false
    env:
      CONTROL_REPO: rozkalnsandris/rozkalns-control-center

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind authorization and validate sealed handoff before mutation
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          stop_pre() {
            {
              printf 'ACCESS_SECRET_ROTATION=STOP\n'
              printf 'STOP=%s\n' "$1"
              printf 'AUTHORIZATION_CONSUMED=NO\n'
              printf 'ROTATE_POST_STARTED=NO\n'
              printf 'PRODUCTION_MUTATION=NO\n'
              printf 'NO_RETRY_ROLLBACK_CLEANUP=YES\n'
            } >&2
            exit 1
          }

          for cmd in jq base64 openssl python3; do
            command -v "$cmd" >/dev/null 2>&1 || stop_pre "MISSING_${cmd^^}"
          done
          [ -n "${GITHUB_EVENT_PATH:-}" ] || stop_pre MISSING_GITHUB_EVENT_PATH
          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || stop_pre WORKFLOW_EVENT_NOT_DISPATCH
          [ "${GITHUB_REF_NAME:-}" = "main" ] || stop_pre WORKFLOW_REF_NOT_MAIN
          [ "${GITHUB_RUN_ATTEMPT:-}" = "1" ] || stop_pre WORKFLOW_ATTEMPT_NOT_ONE

          owner_authorization="$(jq -er '.inputs.owner_authorization | select(type == "string" and length > 0)' "$GITHUB_EVENT_PATH" 2>/dev/null)" || stop_pre OWNER_AUTHORIZATION_MISSING
          printf '::add-mask::%s\n' "$owner_authorization"

          authorization_pattern='^AUTHORIZE_ACCESS_SERVICE_TOKEN_SECRET_ROTATE:([0-9a-f]{40}):([1-9][0-9]*):([1-9][0-9]*):GRACE1H:SEALED_HANDOFF:ROTATE1$'
          [[ "$owner_authorization" =~ $authorization_pattern ]] || stop_pre OWNER_AUTHORIZATION_INVALID
          approved_sha="${BASH_REMATCH[1]}"
          expected_ci_run_id="${BASH_REMATCH[2]}"
          expected_health_run_id="${BASH_REMATCH[3]}"
          [ "${GITHUB_SHA:-}" = "$approved_sha" ] || stop_pre WORKFLOW_SHA_NOT_APPROVED

          recipient_b64="$(jq -er '.inputs.recipient_public_key_b64 | select(type == "string" and length > 0 and length < 8192)' "$GITHUB_EVENT_PATH" 2>/dev/null)" || stop_pre RECIPIENT_PUBLIC_KEY_MISSING
          recipient="$RUNNER_TEMP/recipient-public.pem"
          printf '%s' "$recipient_b64" | base64 --decode > "$recipient" 2>/dev/null || stop_pre RECIPIENT_PUBLIC_KEY_BASE64_INVALID
          openssl pkey -pubin -in "$recipient" -noout >/dev/null 2>&1 || stop_pre RECIPIENT_PUBLIC_KEY_INVALID
          key_bits="$(openssl pkey -pubin -in "$recipient" -text -noout 2>/dev/null | sed -n 's/.*Public-Key: (\([0-9][0-9]*\) bit).*/\1/p' | head -1)"
          [[ "$key_bits" =~ ^[0-9]+$ ]] || stop_pre RECIPIENT_PUBLIC_KEY_SIZE_UNKNOWN
          [ "$key_bits" -ge 3072 ] || stop_pre RECIPIENT_PUBLIC_KEY_TOO_SMALL

          synthetic="$RUNNER_TEMP/synthetic.txt"
          synthetic_sealed="$RUNNER_TEMP/synthetic.sealed"
          printf 'sealed-handoff-preflight' > "$synthetic"
          openssl pkeyutl -encrypt -pubin -inkey "$recipient" -in "$synthetic" -out "$synthetic_sealed" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            >/dev/null 2>&1 || stop_pre SEALED_HANDOFF_PREFLIGHT_FAILED
          [ -s "$synthetic_sealed" ] || stop_pre SEALED_HANDOFF_PREFLIGHT_EMPTY
          rm -f "$synthetic" "$synthetic_sealed"

          python3 scripts/owner-panel-access-secret-rotate.test.py >/dev/null || stop_pre OFFLINE_ROTATION_SAFETY_TEST_FAILED

          {
            printf 'APPROVED_SHA=%s\n' "$approved_sha"
            printf 'EXPECTED_CI_RUN_ID=%s\n' "$expected_ci_run_id"
            printf 'EXPECTED_HEALTH_RUN_ID=%s\n' "$expected_health_run_id"
            printf 'EXPECTED_MAIN_SHA=%s\n' "$approved_sha"
          } >> "$GITHUB_ENV"

          printf 'ROTATION_AUTHORIZATION_BINDING=PASS\n'
          printf 'SEALED_HANDOFF_PREFLIGHT=PASS\n'

      - name: Revalidate evidence, rotate once, and seal new credential
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCESS_READ_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_READ_TOKEN }}
          CLOUDFLARE_ACCESS_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_WRITE_TOKEN }}
          CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
        run: |
          set -euo pipefail
          umask 077

          stop_pre() {
            {
              printf 'ACCESS_SECRET_ROTATION=STOP\n'
              printf 'STOP=%s\n' "$1"
              printf 'AUTHORIZATION_CONSUMED=NO\n'
              printf 'ROTATE_POST_STARTED=NO\n'
              printf 'PRODUCTION_MUTATION=NO\n'
              printf 'NO_RETRY_ROLLBACK_CLEANUP=YES\n'
            } >&2
            exit 1
          }

          stop_post() {
            {
              printf 'ACCESS_SECRET_ROTATION=STOP\n'
              printf 'STOP=%s\n' "$1"
              printf 'AUTHORIZATION_CONSUMED=YES\n'
              printf 'ROTATE_POST_STARTED=YES\n'
              printf 'PRODUCTION_MUTATION=YES_OR_UNCERTAIN\n'
              printf 'NO_RETRY_ROLLBACK_CLEANUP=YES\n'
            } >&2
            exit 1
          }

          for cmd in curl jq openssl base64 python3; do
            command -v "$cmd" >/dev/null 2>&1 || stop_pre "MISSING_${cmd^^}"
          done
          [ -n "${GITHUB_TOKEN:-}" ] || stop_pre MISSING_GITHUB_TOKEN
          [ -n "${CLOUDFLARE_ACCESS_READ_TOKEN:-}" ] || stop_pre MISSING_CLOUDFLARE_ACCESS_READ_TOKEN
          [ -n "${CLOUDFLARE_ACCESS_WRITE_TOKEN:-}" ] || stop_pre MISSING_CLOUDFLARE_ACCESS_WRITE_TOKEN
          [ -n "${CONTROL_ACCESS_CLIENT_ID:-}" ] || stop_pre MISSING_CONTROL_ACCESS_CLIENT_ID
          [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || stop_pre WORKFLOW_EVENT_NOT_DISPATCH
          [ "${GITHUB_REF_NAME:-}" = "main" ] || stop_pre WORKFLOW_REF_NOT_MAIN
          [ "${GITHUB_RUN_ATTEMPT:-}" = "1" ] || stop_pre WORKFLOW_ATTEMPT_NOT_ONE
          [ "${GITHUB_SHA:-}" = "${APPROVED_SHA:-}" ] || stop_pre WORKFLOW_SHA_NOT_APPROVED

          tmp="$(mktemp -d)"
          rotation_payload="$RUNNER_TEMP/rotation-payload.json"
          sealed_payload="$RUNNER_TEMP/rotation-payload.sealed"
          recipient="$RUNNER_TEMP/recipient-public.pem"
          trap 'rm -rf "$tmp"; rm -f "$rotation_payload" "$sealed_payload" "$recipient"' EXIT

          gh_get() {
            local path="$1" out="$2"
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${CONTROL_REPO}${path}" > "$out" || stop_pre GITHUB_GET_FAILED
          }

          gh_get '/branches/main' "$tmp/main.json"
          jq -e --arg sha "$APPROVED_SHA" '.commit.sha == $sha' "$tmp/main.json" >/dev/null || stop_pre MAIN_SHA_DRIFT

          gh_get "/actions/runs/${EXPECTED_CI_RUN_ID}" "$tmp/ci.json"
          jq -e --arg sha "$APPROVED_SHA" --argjson id "$EXPECTED_CI_RUN_ID" '
            .id == $id and
            .name == "CI" and
            .path == ".github/workflows/ci.yml" and
            .head_branch == "main" and
            .head_sha == $sha and
            .event == "push" and
            .run_attempt == 1 and
            .status == "completed" and
            .conclusion == "success"
          ' "$tmp/ci.json" >/dev/null || stop_pre EXACT_MAIN_CI_NOT_PASS

          gh_get "/actions/runs/${EXPECTED_HEALTH_RUN_ID}" "$tmp/health-run.json"
          jq -e --arg sha "$APPROVED_SHA" --argjson id "$EXPECTED_HEALTH_RUN_ID" '
            .id == $id and
            .name == "Owner Action Panel read-only preflight" and
            .path == ".github/workflows/owner-panel-readonly-preflight.yml" and
            .head_branch == "main" and
            .head_sha == $sha and
            .event == "workflow_dispatch" and
            .run_attempt == 1 and
            .status == "completed" and
            .conclusion == "success"
          ' "$tmp/health-run.json" >/dev/null || stop_pre HEALTH403_EVIDENCE_RUN_NOT_PASS

          gh_get "/actions/runs/${EXPECTED_HEALTH_RUN_ID}/jobs?per_page=100" "$tmp/health-jobs.json"
          health_job_id="$(jq -er '[.jobs[] | select(.name == "preflight" and .status == "completed" and .conclusion == "success")] | select(length == 1) | .[0].id' "$tmp/health-jobs.json" 2>/dev/null)" || stop_pre HEALTH403_EVIDENCE_JOB_INVALID
          curl -fsSL --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${CONTROL_REPO}/actions/jobs/${health_job_id}/logs" > "$tmp/health.log" || stop_pre HEALTH403_EVIDENCE_LOG_READ_FAILED
          grep -F '"access_credentials_edge_effect": "NO_DISTINGUISHABLE_403_CLASS_FROM_NO_CREDENTIALS"' "$tmp/health.log" >/dev/null || stop_pre HEALTH403_CREDENTIAL_EFFECT_NOT_BOUND
          grep -F '"production_mutations": 0' "$tmp/health.log" >/dev/null || stop_pre HEALTH403_EVIDENCE_MUTATION_STATE_INVALID

          printf 'BOUND_MAIN_CI_HEALTH403_EVIDENCE=PASS\n'

          export ROTATION_OUTPUT_FILE="$rotation_payload"
          set +e
          rotation_receipt="$(python3 scripts/owner-panel-access-secret-rotate.py)"
          rotation_rc=$?
          set -e
          printf '%s\n' "$rotation_receipt"
          if [ "$rotation_rc" -ne 0 ]; then
            if grep -F 'ROTATION_STATE_UNCERTAIN' <<<"$rotation_receipt" >/dev/null; then
              stop_post ROTATION_STATE_UNCERTAIN
            fi
            stop_pre ROTATION_PREFLIGHT_FAILED
          fi

          printf 'AUTHORIZATION_CONSUMED=YES\n'
          printf 'ROTATE_POST_STARTED=YES\n'
          printf 'CLOUDFLARE_ACCESS_SECRET_ROTATION=YES\n'

          [ "$(stat -c '%a' "$rotation_payload" 2>/dev/null)" = "600" ] || stop_post ROTATION_PAYLOAD_MODE_INVALID
          openssl pkeyutl -encrypt -pubin -inkey "$recipient" -in "$rotation_payload" -out "$sealed_payload" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            >/dev/null 2>&1 || stop_post SEALED_HANDOFF_ENCRYPT_FAILED
          [ -s "$sealed_payload" ] || stop_post SEALED_HANDOFF_EMPTY
          sealed_b64="$(base64 -w0 "$sealed_payload")" || stop_post SEALED_HANDOFF_BASE64_FAILED
          [ -n "$sealed_b64" ] || stop_post SEALED_HANDOFF_BASE64_EMPTY

          printf 'SEALED_ROTATION_PAYLOAD_B64=%s\n' "$sealed_b64"
          printf 'SEALED_HANDOFF=COMPLETE\n'
          printf 'NEXT=UPDATE_GITHUB_CONTROL_ACCESS_CLIENT_SECRET_THEN_GET_ONLY_HEALTH_VERIFY\n'
