name: Phase 3 post-deploy reconciliation report 255

on:
  push:
    branches:
      - phase3/github-only-post-deploy-reconcile-255

permissions:
  contents: read
  issues: write

jobs:
  reconcile-and-report:
    name: reconcile read-only and report sanitized result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONTROL_ACCESS_CLIENT_ID: ${{ secrets.CONTROL_ACCESS_CLIENT_ID }}
      CONTROL_ACCESS_CLIENT_SECRET: ${{ secrets.CONTROL_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Execute exact branch script and comment sanitized result
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          script=/tmp/phase254-reconcile.sh
          curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/phase3-post-deploy-readonly-reconcile-255.sh" > "$script"
          chmod 700 "$script"

          set +e
          output="$(bash "$script" 2>&1)"
          rc=$?
          set -e

          safe_output="$(printf '%s\n' "$output" | grep -E '^(PHASE254_GITHUB_RECONCILIATION|STOP|SOURCE_SHA|CI_RUN_ID|NEW_VERSION|NEW_DEPLOYMENT|ACTIVE_TRAFFIC_PERCENT|HEALTH_HTTP|DASHBOARD_HTTP|PREFLIGHT_HTTP|PREFLIGHT_KIND|PREFLIGHT_POLICY_COVERAGE|PREFLIGHT_HEAD_SHA|PREFLIGHT_MAIN_SHA|NEEDS_CHANGES_POST|CLOUDFLARE_MUTATION|DEPLOY_RETRY|AUTHORIZATION_CONSUMED)=' || true)"
          if [ -z "$safe_output" ]; then
            safe_output=$'PHASE254_GITHUB_RECONCILIATION=STOP\nSTOP=EMPTY_SANITIZED_RESULT\nCLOUDFLARE_MUTATION=NO\nDEPLOY_RETRY=FORBIDDEN\nAUTHORIZATION_CONSUMED=YES'
            rc=1
          fi

          if [ "$rc" -eq 0 ]; then
            heading='## GitHub-only #254 reconciliation — PASS'
          else
            heading='## GitHub-only #254 reconciliation — STOP'
          fi

          body="${heading}

\`\`\`text
${safe_output}
\`\`\`

Execution source: branch \`${GITHUB_REF_NAME}\`, commit \`${GITHUB_SHA}\`.

This run performed Cloudflare/Access verification GETs only. The only write in this reporting workflow is this sanitized GitHub issue comment. No deploy retry, D1/Queue write, GitHub review mutation, or #247 REQUEST_CHANGES is authorized or executed."

          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/255/comments" >/dev/null

          exit "$rc"
